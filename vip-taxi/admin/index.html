  editBill:d=>{const b=S.bills.find(x=>x.id===d.id);billForm(b.type,b)},
  batch:()=>batchForm(),
  clrMonth:d=>{U.bill[d.t].month='';render()},
  addItem:()=>{document.getElementById('items').insertAdjacentHTML('beforeend',itemRow());M.calc&&M.calc()},
  rmItem:(d,el)=>{const rows=document.querySelectorAll('#items .row');if(rows.length>1)el.closest('.row').remove();M.calc&&M.calc()},
  rmPay:async d=>{if(!needMgr())return;const b=S.bills.find(x=>x.id===d.id);const p=b.payments.find(x=>x.id===d.p);
    if(!await confirmBox(`ลบรายการรับชำระ ฿${money(p.amount)} วันที่ ${fd(p.date)} ออกจากบิล ${esc(b.no)}?`,'ลบรายการ',true)){viewBill(b.id);return}
    let saved;await safe(async()=>{saved=await put('bills',{...b,payments:b.payments.filter(x=>x.id!==d.p)})},'ลบรายการชำระแล้ว');log('ลบรายการชำระ',`บิล ${b.no} ฿${money(p.amount)} ${p.receiptNo||''}`);viewBill(b.id,saved)},
  voidBill:async d=>{if(!needMgr())return;const b=S.bills.find(x=>x.id===d.id);
    if(!await confirmBox(`ยกเลิกบิล <b>${esc(b.no)}</b> ของ ${esc(dName(b.driverId))} ยอด ฿${money(bTotal(b))}? บิลที่ยกเลิกจะไม่นับในยอดค้างและรายงาน`,'ยกเลิกบิล',true)){viewBill(b.id);return}
    let saved;await safe(async()=>{saved=await put('bills',{...b,void:true,voidDate:today()})},'ยกเลิกบิลแล้ว');log('ยกเลิกบิล',`${b.no} ${dName(b.driverId)} ฿${money(bTotal(b))}`);viewBill(b.id,saved)},
  dlBill:d=>{const b=S.bills.find(x=>x.id===d.id);saveFile(`${b.no}.html`,billDoc(b))},
  csv:()=>{if(R.cur)saveFile(R.cur.name+'.csv',csv(R.cur))},
  repTab:d=>{U.rep.tab=d.k;render()},
  multiPay:d=>multiPay(d.id),
  fbLogout:()=>{FB.auth.signOut().then(()=>location.reload())},
  ibTab:d=>{U.ib.tab=d.k;render()},
  slipView:d=>slipView(d.id),slipYes:d=>slipDecide(d.id,true),slipNo:d=>slipDecide(d.id,false),
  reqView:d=>reqView(d.id),reqYes:d=>reqDecide(d.id,true),reqNo:d=>reqDecide(d.id,false),
  appPin:d=>appPinForm(d.id),
  staffForm:()=>staffForm(),
  staffRole:async d=>{const x=S.staff.find(y=>y.id===d.id);const nr=x.role==='manager'?'cashier':'manager';if(await safe(()=>FB.fs.doc('staff/'+d.id).update({role:nr}),'เปลี่ยนสิทธิ์แล้ว'))log('เปลี่ยนสิทธิ์พนักงาน',`${x.name} → ${nr}`)},
  staffDel:async d=>{const x=S.staff.find(y=>y.id===d.id);if(!await confirmBox(`ถอนสิทธิ์ ${esc(x.name||x.email)} ออกจากระบบ?`,'ถอนสิทธิ์',true))return;if(await safe(()=>FB.fs.doc('staff/'+d.id).delete(),'ถอนสิทธิ์แล้ว'))log('ถอนสิทธิ์พนักงาน',x.name||x.email)},
  exportJSON:()=>exportJSON(),
  receipt:(d,el,e)=>{e.stopPropagation?.();viewReceipt(d.no)},
  dlReceipt:d=>{const r=receipts().find(x=>x.no===d.no);if(r)saveFile(`${r.no}.html`,docWrap(r.no,receiptInner(r),['ผู้รับเงิน','ผู้ชำระเงิน']))},
  settle:d=>settleForm(d.id),
  settleView:d=>settleView(d.id),
  dlSettle:d=>{const x=D(d.id);if(x?.settlement)saveFile(`ปิดบัญชี-${x.code||x.name}.html`,docWrap('ปิดบัญชี '+x.name,settleInner(x),['ผู้จ่ายเงิน (บริษัท)','ผู้รับเงินคืน (คนขับ)']))},
  stmt:d=>stmtView(d.id),
  dlStmt:d=>{const f=document.getElementById('st-f')?.value||thisMonth()+'-01',t=document.getElementById('st-t')?.value||today();const x=D(d.id);saveFile(`สรุปยอด-${x?.code||x?.name}-${f}-${t}.html`,docWrap('สรุปยอด '+(x?.name||''),stmtInner(d.id,f,t),null))},
  maintForm:d=>maintForm(d.id),
  delMaint:async d=>{if(!needMgr())return;const m=S.maint.find(x=>x.id===d.id);if(!await confirmBox(`ลบบันทึกการซ่อม "${esc(m.desc)}"? บิลที่เรียกเก็บจากคนขับจะไม่ถูกลบ`,'ลบ',true)){maintForm(d.id);return}if(await safe(()=>del('maint',d.id),'ลบแล้ว'))log('ลบบันทึกซ่อม',m.desc)},
  offForm:d=>offForm(d.id),
  delOff:async d=>{if(!needMgr())return;const o=S.offdays.find(x=>x.id===d.id);if(!await confirmBox('ลบวันงดเก็บค่าเช่านี้?','ลบ',true)){offForm(d.id);return}if(await safe(()=>del('offdays',d.id),'ลบแล้ว'))log('ลบวันงดเก็บ',`${fd(o.from)} ${o.reason||''}`)},
  campForm:d=>campForm(d.id),
  delCamp:async d=>{if(!needMgr())return;const c=S.campaigns.find(x=>x.id===d.id);if(!await confirmBox(`ลบแคมเปญ ${esc(c.name)}? ส่วนลดในบิลที่ออกไปแล้วยังคงอยู่`,'ลบ',true)){campForm(d.id);return}if(await safe(()=>del('campaigns',d.id),'ลบแคมเปญแล้ว'))log('ลบแคมเปญ',c.name)},
  autoNow:()=>{autoBlocked=false;autoIssue(true)},
  waive:async d=>{if(!needMgr())return;const b=S.bills.find(x=>x.id===d.id);const fee=bFee(b);
    if(!await confirmBox(`ยกเว้นค่าปรับชำระล่าช้า ฿${money(fee)} ของบิล <b>${esc(b.no)}</b>?`,'ยกเว้นค่าปรับ')){viewBill(b.id);return}
    let saved;await safe(async()=>{saved=await put('bills',{...b,waiveLate:true})},'ยกเว้นค่าปรับแล้ว');log('ยกเว้นค่าปรับ',`${b.no} ฿${money(fee)}`);viewBill(b.id,saved)},
  unwaive:async d=>{if(!needMgr())return;const b=S.bills.find(x=>x.id===d.id);let saved;await safe(async()=>{saved=await put('bills',{...b,waiveLate:false})},'คิดค่าปรับตามปกติแล้ว');log('ยกเลิกการยกเว้นค่าปรับ',b.no);viewBill(b.id,saved)},
  fleetTab:d=>{U.fleet.tab=d.k;render()},
  mShift:d=>{const [y,m]=U.sched.month.split('-').map(Number);const n=new Date(y,m-1+(+d.d),1);U.sched.month=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;render()},
  carForm:d=>{if(needMgr())carForm(d.id)},
  drvForm:d=>{if(needMgr())drvForm(d.id)},
  delCar:async d=>{if(!needMgr())return;const c=C(d.id);if(S.bills.some(b=>b.carId===d.id)||driverOn(d.id)){toast('ลบไม่ได้ รถคันนี้มีบิลหรือคนขับผูกอยู่ ให้เปลี่ยนสถานะเป็นเลิกใช้แทน','bad');return}
    if(await confirmBox(`ลบรถ ${esc(c.plate)} ออกจากระบบ?`,'ลบรถ',true))await safe(()=>del('cars',d.id),'ลบรถแล้ว')},
  doSwap:async()=>{if(!needMgr())return;const f=U.swap,car=C(f.carId),nd=D(f.newId);if(!car||!nd)return;const old=driverOn(car.id);
    const other=nd.carId&&nd.carId!==car.id?nd.carId:null;
    const msg=other?`สลับรถระหว่าง ${esc(nd.name)} และ ${old?esc(old.name):'(รถว่าง)'} มีผล ${fd(f.date)}`:`ให้ ${esc(nd.name)} ขับ ${esc(car.plate)} ${old?'แทน '+esc(old.name):''} มีผล ${fd(f.date)}`;
    if(!await confirmBox(msg+'?','ยืนยันเปลี่ยนคนขับ'))return;
    const ok=await safe(async()=>{
      await put('drivers',{...nd,carId:car.id,status:'active',since:f.date});
      if(old){if(other)await put('drivers',{...old,carId:other,since:f.date});else await put('drivers',{...old,carId:null,status:f.endOld?'inactive':old.status})}
      await put('swaps',{date:f.date,carId:car.id,fromDriverId:old?.id||null,toDriverId:nd.id,otherCarId:other,mode:other?'swap':'replace',reason:f.reason,note:f.note.trim(),createdAt:new Date().toISOString()});
    },'เปลี่ยนคนขับเรียบร้อย');
    if(ok){log('เปลี่ยนคนขับ',`${car.plate}: ${old?old.name:'ว่าง'} → ${nd.name}${other?' (สลับรถ)':''}`);U.swap={...U.swap,carId:'',newId:'',note:'',endOld:false};render()}},
  clearSample:async()=>{if(!needMgr())return;const list=COLS.flatMap(k=>S[k].filter(x=>x.sample).map(x=>[k,x.id]));
    if(!await confirmBox(`ลบข้อมูลตัวอย่าง ${list.length} รายการ? ข้อมูลที่คุณเพิ่มเองจะไม่ถูกลบ`,'ลบข้อมูลตัวอย่าง',true))return;
    await safe(async()=>{for(let i=0;i<list.length;i+=10)await Promise.all(list.slice(i,i+10).map(([k,id])=>del(k,id)))},'ลบข้อมูลตัวอย่างแล้ว')}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=ACT[a.dataset.act];if(!fn)return;if(a.tagName==='A')e.preventDefault();
  if(a.dataset.act==='view'&&e.target.closest('button[data-act="pay"]'))return;fn(a.dataset,a,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f){setPath(U,el.dataset.f,el.type==='checkbox'?el.checked:el.value);if(el.dataset.rr!=='0'&&el.type!=='date'&&el.type!=='month')render()}
  if(el.closest('#billForm')&&M.calc&&('calc' in el.dataset))M.calc(el.dataset.calc)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='importFile'&&el.files[0]){importJSON(el.files[0]);el.value='';return}
  if(el.dataset.f&&(el.type==='date'||el.type==='month'||el.tagName==='SELECT'||el.type==='checkbox')){setPath(U,el.dataset.f,el.type==='checkbox'?el.checked:el.value);render()}
  if(el.closest('#billForm')&&M.calc&&el.tagName==='SELECT')M.calc(el.dataset.calc)});
document.addEventListener('submit',async e=>{if(e.target.id!=='setForm')return;e.preventDefault();if(!needMgr())return;const F=e.target;const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const ok=await safe(()=>putConfig({...(S.config||{}),company:F.company.value.trim(),address:F.address.value.trim(),phone:F.phone.value.trim(),taxId:F.taxId.value.trim(),rentDueDays:+F.rentDueDays.value||0,otherDueDays:+F.otherDueDays.value||0,insuranceTypes:lines(F.insuranceTypes.value),otherTypes:lines(F.otherTypes.value),
    autoRent:F.autoRent.checked,promptpay:F.promptpay.value.replace(/\D/g,''),promptpayName:F.promptpayName.value.trim(),expiryWarnDays:+F.expiryWarnDays.value||30,autoTime:F.autoTime.value||'06:00',autoFrom:F.autoFrom.value||'',
    late:{on:F.lateOn.checked,types:[...F.querySelectorAll('[name=lateType]:checked')].map(x=>x.value),mode:F.lateMode.value,amount:+F.lateAmount.value||0,grace:+F.lateGrace.value||0,cap:+F.lateCap.value||0}}),'บันทึกการตั้งค่าแล้ว');
  if(ok){log('แก้ไขการตั้งค่า','');setTimeout(()=>autoIssue(),800)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.ov'))closeModal()});

/* ---------- init ---------- */
(function(){const h=(location.hash||'').slice(1);if(PAGES[h])S.page=h})();
async function init(){
  render();
  let db=null,dl=null,us=null;
  try{if(window.claude?.use)[db,dl,us]=await Promise.all([window.claude.use('db'),window.claude.use('downloads'),window.claude.use('user')])}catch(e){}
  DB=db;DL=dl;USER=us;
  if(USER){try{const [own,ed,id]=await Promise.all([USER.isOwner(),USER.canEdit(),USER.id()]);S.me={id,owner:!!own,manager:!!(own||ed)};resolveNames([id])}catch(e){}}
  setInterval(()=>autoIssue(),60000);
  if(DB){S.mode='db';startDb()}
  else if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){try{await fbBoot(window.FIREBASE_CONFIG)}catch(e){console.error(e);document.getElementById('main').innerHTML='<div class="loading">เชื่อมต่อ Firebase ไม่ได้ ตรวจอินเทอร์เน็ตและไฟล์ firebase-config.js</div>'}}
  else{S.mode='local';loadLocal();S.ready=true;render();setTimeout(()=>autoIssue(),1500)}
}
function startDb(){const reg=f=>{if(FB&&FB.unsubs)FB.unsubs.push(f)};
    const pending=new Set([...COLS,'config','auto']);
    const done=k=>{pending.delete(k);if(!pending.size&&!S.ready){S.ready=true;setTimeout(()=>autoIssue(),1500)}schedule()};
    const onErr=e=>toast('เชื่อมต่อข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า','bad');
    COLS.forEach(c=>reg(DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));done(c)},onErr)));
    reg(DB.doc('config/main').onSnapshot(s=>{S.config=s.exists?s.data():null;done('config')},onErr));
    reg(DB.doc('state/auto').onSnapshot(s=>{S.auto=s.exists?s.data():{};done('auto')},()=>done('auto')));
    reg(DB.collection('logs').orderBy('date','desc').limit(62).onSnapshot(s=>{S.logs=s.docs.map(d=>({...d.data(),id:d.id}));schedule()},()=>{}));
}
init();
</script>
