<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>ระบบเก็บค่าเช่าแท็กซี่ VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: royal-blue gradient sidebar + bright white work area; each page opens with a blue-to-sky banner, colored stat cards, white table panels */
:root{
  --bg:#eef3fb; --surface:#ffffff; --sunk:#f4f7fd; --tint:#e7eefc; --ink:#0f1b3d; --muted:#5a6788; --line:#dde6f4;
  --accent:#1d4ed8; --accent-2:#3b82f6; --accent-soft:#e3ecff; --on-accent:#ffffff;
  --side-a:#0b2a6f; --side-b:#1747c9; --side-ink:#dbe6ff; --side-dim:#9db3ea; --nav-on-bg:#ffffff; --nav-on-ink:#0b2a6f;
  --hero-a:#1d4ed8; --hero-b:#0ea5e9; --hero-ink:#ffffff;
  --ok:#0e9f6e; --ok-soft:#dcf7ec; --info:#7c3aed; --info-soft:#efe8ff; --bad:#e11d48; --bad-soft:#ffe4ea; --warn:#d97706; --warn-soft:#fff2d6; --sky:#0284c7; --sky-soft:#dff3fd; --void:#8a94ab;
  --avbg-l:92%; --avfg-l:34%;
  --shadow:0 1px 2px rgba(15,27,61,.05),0 10px 28px -14px rgba(29,78,216,.28);
  --overlay:rgba(8,20,52,.55);
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101f; --surface:#0f1a31; --sunk:#0c162b; --tint:#15244a; --ink:#e6edff; --muted:#93a3c8; --line:#203258;
  --accent:#4f8bff; --accent-2:#60a5fa; --accent-soft:#18295a; --on-accent:#ffffff;
  --side-a:#061232; --side-b:#0d2b7a; --side-ink:#d6e2ff; --side-dim:#8199d3; --nav-on-bg:rgba(255,255,255,.14); --nav-on-ink:#ffffff;
  --hero-a:#1e40af; --hero-b:#0369a1; --hero-ink:#ffffff;
  --ok:#34d399; --ok-soft:#0d3326; --info:#a78bfa; --info-soft:#271d4d; --bad:#fb7185; --bad-soft:#3e1426; --warn:#fbbf24; --warn-soft:#3a2b0a; --sky:#38bdf8; --sky-soft:#0b2c42; --void:#7d88a3;
  --avbg-l:24%; --avfg-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --overlay:rgba(2,6,18,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08101f; --surface:#0f1a31; --sunk:#0c162b; --tint:#15244a; --ink:#e6edff; --muted:#93a3c8; --line:#203258;
  --accent:#4f8bff; --accent-2:#60a5fa; --accent-soft:#18295a; --on-accent:#ffffff;
  --side-a:#061232; --side-b:#0d2b7a; --side-ink:#d6e2ff; --side-dim:#8199d3; --nav-on-bg:rgba(255,255,255,.14); --nav-on-ink:#ffffff;
  --hero-a:#1e40af; --hero-b:#0369a1; --hero-ink:#ffffff;
  --ok:#34d399; --ok-soft:#0d3326; --info:#a78bfa; --info-soft:#271d4d; --bad:#fb7185; --bad-soft:#3e1426; --warn:#fbbf24; --warn-soft:#3a2b0a; --sky:#38bdf8; --sky-soft:#0b2c42; --void:#7d88a3;
  --avbg-l:24%; --avfg-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --overlay:rgba(2,6,18,.7);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:linear-gradient(170deg,var(--side-a),var(--side-b));color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:22px 14px;position:sticky}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 4px}
.brand .meter{font-family:var(--f-display);font-weight:700;color:#1747c9;background:#fff;border-radius:10px;padding:7px 8px;font-size:13px;letter-spacing:.06em;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.brand b{font-family:var(--f-display);font-size:16px;color:#fff;line-height:1.25;font-weight:600}
.brand small{display:block;color:var(--side-dim);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-size:11px;letter-spacing:.08em;color:var(--side-dim);padding:14px 12px 4px}
.nav a{display:flex;align-items:center;gap:11px;color:var(--side-ink);text-decoration:none;padding:9px 12px;border-radius:10px;font-size:14px;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--nav-on-bg);color:var(--nav-on-ink);font-weight:500;box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}
.nav a svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--side-dim);padding:10px 12px;background:rgba(255,255,255,.07);border-radius:10px}
.side .foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-right:6px;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.side .foot .dot.local{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
/* main */
.main{padding-block:22px 56px;padding-inline:clamp(16px,3vw,32px);min-width:0}
.ph{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;padding:22px 24px;border-radius:18px;color:var(--hero-ink);
  background:radial-gradient(circle at 92% -30%,rgba(255,255,255,.28) 0 120px,transparent 121px),radial-gradient(circle at 78% 140%,rgba(255,255,255,.16) 0 90px,transparent 91px),linear-gradient(120deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow)}
.ph>*{position:relative;min-width:0}
.ph h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.6vw,28px);margin:0;line-height:1.25;text-wrap:balance}
.ph p{margin:4px 0 0;color:rgba(255,255,255,.86);max-width:64ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.ph .btn:hover{background:rgba(255,255,255,.26);border-color:#fff}
.ph .btn.pri{background:#fff;color:#1747c9;border-color:#fff;font-weight:600}
.ph input{background:rgba(255,255,255,.95);color:#0f1b3d;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 15px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);font-weight:500;box-shadow:0 6px 14px -8px var(--accent)}
.btn.dng{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel>h2,.sec-h{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2::before{content:"";width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--hero-b));margin-right:-2px;flex:none}
.panel>h2{justify-content:flex-start}
.panel>h2>.btn,.panel>h2>span{margin-left:auto}
.panel .pb{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid2>*{min-width:0}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{--kc:var(--accent);--ks:var(--accent-soft);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-28px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:var(--ks);opacity:.7}
.kpi>*{position:relative;z-index:1}
.kpi .ic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ks);color:var(--kc)}
.kpi .ic svg{width:21px;height:21px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.kpi .s{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:4px}
.k-blue{--kc:var(--accent);--ks:var(--accent-soft)} .k-sky{--kc:var(--sky);--ks:var(--sky-soft)} .k-violet{--kc:var(--info);--ks:var(--info-soft)} .k-amber{--kc:var(--warn);--ks:var(--warn-soft)}
.kpi.ok{--kc:var(--ok);--ks:var(--ok-soft)} .kpi.bad{--kc:var(--bad);--ks:var(--bad-soft)}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0 14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
textarea{resize:vertical;min-height:60px}
.filters input[type=text]{width:240px}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:500;color:var(--accent);text-align:left;font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--tint)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;background:var(--sunk)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:500}
.empty::before{content:"";display:block;width:46px;height:46px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(135deg,var(--accent-soft),var(--sky-soft))}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-paid{background:var(--ok-soft);color:var(--ok)}
.st-partial{background:var(--info-soft);color:var(--info)}
.st-overdue{background:var(--bad-soft);color:var(--bad)}
.st-open{background:var(--accent-soft);color:var(--accent)}
.st-void{background:var(--sunk);color:var(--void);text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 8px;color:var(--sky);background:var(--sky-soft);font-weight:500}
/* avatar */
.av{flex:none;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:14px;background:hsl(var(--h) 75% var(--avbg-l));color:hsl(var(--h) 65% var(--avfg-l));font-family:var(--f-display)}
.pp{display:flex;align-items:center;gap:10px;min-width:0}
/* Thai license plate */
.plate{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;line-height:1.15;background:var(--surface);min-width:78px;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--line)}
.plate b{font-family:var(--f-display);font-size:13.5px;font-weight:600;letter-spacing:.02em}
.plate small{font-size:9.5px;color:var(--muted);margin-top:-1px}
/* schedule grid */
.sched{font-size:12.5px}
.sched th,.sched td{padding:6px 4px;text-align:center;border-left:1px solid var(--line)}
.sched th:first-child,.sched td:first-child{position:sticky;left:0;z-index:1;text-align:left;padding:6px 14px;min-width:200px;background:var(--surface);border-left:0;box-shadow:1px 0 0 var(--line)}
.sched thead th:first-child{background:var(--tint)}
.sched tfoot td:first-child{background:var(--sunk)}
.sched th.we{color:var(--bad)}
.sched th.td{background:var(--accent);color:#fff;border-radius:8px 8px 0 0}
.sched th.td .muted{color:rgba(255,255,255,.8)}
.cell{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:7px;font-size:11px;cursor:pointer;border:1px solid transparent;font-weight:600;transition:transform .1s}
.cell:hover{transform:scale(1.12)}
.c-paid{background:var(--ok);color:var(--surface)}
.c-partial{background:var(--info);color:var(--surface)}
.c-overdue{background:var(--bad);color:var(--surface)}
.c-open{border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.c-none{cursor:default;color:var(--line)}
.c-none:hover{transform:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .cell{width:17px;height:17px;cursor:default;margin-right:5px;vertical-align:middle}
/* tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--tint);border-radius:12px;margin-bottom:16px;max-width:100%;overflow-x:auto}
.tabs a{padding:7px 16px;color:var(--muted);text-decoration:none;border-radius:9px;white-space:nowrap;cursor:pointer}
.tabs a.on{color:var(--accent);background:var(--surface);font-weight:500;box-shadow:var(--shadow)}
/* modal */
.ov{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow-y:auto}
.mod{background:var(--surface);border-radius:18px;width:min(780px,100%);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden}
.mod.narrow{width:min(500px,100%)}
.mod header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 20px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff}
.mod header h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px}
.mod header .btn{color:#fff}
.mod .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.mod footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--sunk)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.frm .full{grid-column:1/-1}
.calc{background:linear-gradient(120deg,var(--accent-soft),var(--sky-soft));border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.calc .tot{font-family:var(--f-num);font-size:21px;font-weight:600;color:var(--accent)}
.items .row{display:grid;grid-template-columns:minmax(0,1fr) 70px 110px 32px;gap:6px;margin-bottom:6px}
.items .row input{width:100%}
.err{color:var(--bad);font-size:13px}
.note{background:var(--sky-soft);color:var(--ink);border-radius:10px;padding:10px 13px;font-size:13.5px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
/* invoice */
.inv{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surface)}
.inv .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:14px}
.inv .co b{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--accent)}
.inv .doc{text-align:right}
.inv .doc .t{font-family:var(--f-display);font-size:17px;font-weight:600}
.inv .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;margin:14px 0}
.inv .meta div{display:flex;gap:8px}
.inv .meta span{color:var(--muted);min-width:88px}
.inv .words{background:var(--accent-soft);color:var(--accent);padding:7px 12px;border-radius:8px;font-size:13px;margin-top:10px}
.inv .stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;padding:2px 12px;font-family:var(--f-display);font-weight:700;transform:rotate(-4deg);letter-spacing:.05em}
.inv .tw{border:1px solid var(--line);border-radius:10px}
/* toast */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 12px 28px -10px rgba(0,0,0,.45);max-width:min(380px,90vw);font-size:13.5px}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 13px;margin-bottom:16px;font-size:13px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.chart .grid{stroke:var(--line)}
.chart .s0{stop-color:var(--accent-2)} .chart .s1{stop-color:var(--accent)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.rowline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline.click:hover{background:var(--sunk)}
.who{min-width:0}
.who b{font-weight:500}
.who small{display:block;color:var(--muted);font-size:12px}
.chk{display:flex;gap:8px;align-items:center}
.nbadge{margin-left:auto;background:#fb7185;color:#fff;font-size:11px;font-weight:600;border-radius:99px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.lg-wrap{max-width:460px;margin:6vh auto 0;display:flex;flex-direction:column;gap:0}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.xchip{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;white-space:nowrap;font-weight:500}
.x-ok{background:var(--sunk);color:var(--muted)} .x-warn{background:var(--warn-soft);color:var(--warn)} .x-bad{background:var(--bad-soft);color:var(--bad)}
.c-off{background:var(--warn-soft);color:var(--warn);cursor:help}
.ppq{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(120deg,var(--surface),var(--sky-soft))}
.qrbox{width:156px;height:156px;background:#ffffff;border-radius:10px;padding:4px;flex:none;box-shadow:0 0 0 1px var(--line)}
.qrbox svg{display:block;width:100%;height:100%}
.ppt{display:flex;flex-direction:column;gap:2px;min-width:0}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

<script>
/* ---------- constants & helpers ---------- */

const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const TYPE={rent:{t:'ค่าเช่ารายวัน',doc:'ใบแจ้งหนี้ค่าเช่ารถรายวัน',pre:'RN'},insurance:{t:'ค่าประกัน',doc:'ใบแจ้งหนี้ค่าประกัน',pre:'IN'},other:{t:'ค่าอื่นๆ',doc:'ใบแจ้งหนี้ค่าใช้จ่ายอื่นๆ',pre:'OT'}};

function bahtText(num){
  const N=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const seg=str=>{str=str.replace(/^0+/,'');if(!str)return '';let o='';const L=str.length;const val=+str;
    for(let i=0;i<L;i++){const d=+str[i],p=L-1-i;if(!d)continue;
      if(p===1&&d===1)o+='สิบ';else if(p===1&&d===2)o+='ยี่สิบ';else if(p===0&&d===1&&val>1)o+='เอ็ด';else o+=N[d]+P[p];}
    return o};
  const read=str=>{str=str.replace(/^0+/,'');if(!str)return '';if(str.length>6){return read(str.slice(0,-6))+'ล้าน'+seg(str.slice(-6))}return seg(str)};
  num=r2(Math.abs(num));const [b,s]=num.toFixed(2).split('.');
  const bt=read(b),st=read(s);
  if(!bt&&!st)return 'ศูนย์บาทถ้วน';
  return (bt?bt+'บาท':'')+(st?st+'สตางค์':'ถ้วน');
}
/* bills */
const bTotal=b=>Math.max(0,r2((b.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)-(+b.discount||0)));
const bPaid=b=>r2((b.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));
function ruleFor(type){const L=cfg().late;return L.on&&L.types.includes(type)&&+L.amount>0?{mode:L.mode,amount:+L.amount,grace:+L.grace||0,cap:+L.cap||0}:null}
function lateRuleOf(b){if(b.lateRule===null)return null;if(b.lateRule)return b.lateRule;return ruleFor(b.type)}
/* late fee: counts days after due date (minus grace) until the principal is fully paid, or until today */
function lateInfo(b){
  const z={fee:0,days:0};if(b.void||!b.dueDate||b.waiveLate)return z;const R=lateRuleOf(b);if(!R||!(+R.amount>0))return z;
  const P=bTotal(b);if(P<=0)return z;let stop=today(),cum=0;
  for(const p of (b.payments||[]).slice().sort((a,c)=>(a.date||'').localeCompare(c.date||''))){cum+=+p.amount||0;if(cum>=P-0.004){stop=p.date;break}}
  const late=diffDays(b.dueDate,stop),days=late-(+R.grace||0);if(days<=0)return {fee:0,days:Math.max(0,late)};
  let fee=R.mode==='flat'?+R.amount:R.mode==='percent'?P*(+R.amount)/100*days:days*(+R.amount);
  if(+R.cap>0)fee=Math.min(fee,+R.cap);return {fee:r2(fee),days:late};
}
const bFee=b=>lateInfo(b).fee;
const bDue=b=>r2(bTotal(b)+bFee(b));
const bBal=b=>b.void?0:Math.max(0,r2(bDue(b)-bPaid(b)));
function bSt(b){if(b.void)return 'void';const t=bDue(b),p=bPaid(b);if(t-p<=0.004)return 'paid';if(b.dueDate&&b.dueDate<today())return 'overdue';if(p>0)return 'partial';return 'open'}
const live=()=>S.bills.filter(b=>!b.void);
const rentCover=(did,day)=>S.bills.find(b=>b.type==='rent'&&!b.void&&b.driverId===did&&b.from<=day&&day<=b.to);
const allPays=()=>S.bills.filter(b=>!b.void).flatMap(b=>(b.payments||[]).map(p=>({...p,bill:b})));
function nextNo(type,dateStr,pending=[]){
  const yy=String(+dateStr.slice(0,4)+543).slice(2),mm=dateStr.slice(5,7);const pre=`${TYPE[type].pre}${yy}${mm}-`;const extra=0;
  let mx=0;[...S.bills,...pending].forEach(b=>{if(b.no&&b.no.startsWith(pre)){const n=parseInt(b.no.slice(pre.length));if(n>mx)mx=n}});
  return pre+String(mx+1+extra).padStart(4,'0');
}
function makeRent(d,day,pending,note){const car=C(d.carId),c=cfg();const cd=campDisc(d,day,+car.dailyRate||0,pending);if(cd.amt)note=[note,'แคมเปญ: '+cd.name].filter(Boolean).join(' · ');const b={type:'rent',driverId:d.id,carId:car.id,issueDate:day,dueDate:addDays(day,+c.rentDueDays||0),from:day,to:day,discount:cd.amt,campaign:cd.amt?cd.name:undefined,items:[{desc:`ค่าเช่ารถ ${car.plate} ${fd(day)}`,qty:1,price:+car.dailyRate||0}],payments:[],lateRule:ruleFor('rent'),note,createdAt:new Date().toISOString()};b.no=nextNo('rent',day,pending);return b}
function rentDue(day){return S.drivers.filter(d=>d.status!=='inactive'&&d.carId&&C(d.carId)&&(C(d.carId).status||'active')==='active'&&(!d.since||d.since<=day)&&(!d.startDate||d.startDate<=day)&&!offFor(d,day))}
function billDesc(b){if(b.type==='rent')return `${b.items?.[0]?.qty??(diffDays(b.from,b.to)+1)} วัน · ${fd(b.from)}${b.from!==b.to?' – '+fd(b.to):''}`;return [b.category,b.period].filter(Boolean).join(' · ')||(b.items?.[0]?.desc||'')}

/* off days (no rent charged) */
function offFor(d,day){return S.offdays.find(o=>o.from<=day&&day<=(o.to||o.from)&&(o.kind==='all'||(o.kind==='car'&&o.carId===d.carId)||(o.kind==='driver'&&o.driverId===d.id)))}
/* campaigns */
const CAMP_KIND={freeday:'เช่าครบ N วัน ฟรี 1 วัน',percent:'ลดค่าเช่า %',newdriver:'ส่วนลดคนขับใหม่ (บาท/วัน)'};
function rentDaysIn(did,from,to,pending=[]){if(to<from)return 0;return [...S.bills,...pending].filter(b=>b.type==='rent'&&!b.void&&b.driverId===did&&b.from<=to&&b.to>=from).reduce((s,b)=>s+diffDays(b.from<from?from:b.from,b.to>to?to:b.to)+1,0)}
function campDisc(d,day,rate,pending=[]){let best={amt:0,name:''};
  S.campaigns.filter(c=>c.active!==false&&c.from<=day&&(!c.to||day<=c.to)&&(!c.carId||c.carId===d.carId)).forEach(c=>{let a=0;
    if(c.kind==='percent')a=rate*(+c.pct||0)/100;
    else if(c.kind==='newdriver'){const s=d.startDate;if(s&&diffDays(s,day)>=0&&diffDays(s,day)<(+c.days||0))a=Math.min(rate,+c.perDay||0)}
    else if(c.kind==='freeday'){const N=+c.every||0;if(N>0){const cnt=rentDaysIn(d.id,c.from,addDays(day,-1),pending);if((cnt+1)%(N+1)===0)a=rate}}
    if(a>best.amt)best={amt:r2(a),name:c.name}});
  return best}
function rangeRent(d,from,to,rate){let days=0,off=0,disc=0;const names=new Set();const pend=[];
  for(let day=from;day<=to;day=addDays(day,1)){if(d&&offFor(d,day)){off++;continue}days++;
    if(d){const cd=campDisc(d,day,rate,pend);if(cd.amt){disc+=cd.amt;names.add(cd.name)}pend.push({type:'rent',driverId:d.id,from:day,to:day})}}
  return {days,off,disc:r2(disc),names:[...names]}}
/* PromptPay QR (EMVCo) */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function ppPayload(id,amt){const d=String(id||'').replace(/\D/g,'');if(d.length<9)return null;let acc;
  if(d.length>=15)acc=tlv('03',d);else if(d.length===13)acc=tlv('02',d);else acc=tlv('01',('66'+d.replace(/^0/,'')).padStart(13,'0'));
  const p=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('58','TH')+tlv('53','764')+(amt?tlv('54',(+amt).toFixed(2)):'')+'6304';return p+crc16(p)}
function qrSvg(text){try{if(!window.qrcode)return '';const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}}

/* receipts */
function nextReceipt(pendingNos=[]){const t=today();const pre=`RC${String(+t.slice(0,4)+543).slice(2)}${t.slice(5,7)}-`;let mx=0;
  [...allPays().map(p=>p.receiptNo),...pendingNos].forEach(n=>{if(n&&n.startsWith(pre)){const k=parseInt(n.slice(pre.length));if(k>mx)mx=k}});return pre+String(mx+1).padStart(4,'0')}

   <div class="tw"><table><thead><tr><th>ชำระบิลเลขที่</th><th>รายการ</th><th class="r">จำนวนเงิน</th></tr></thead><tbody>

/* audit log */
const LOGQ=[];let logBusy=false;
async function log(action,detail){LOGQ.push({t:new Date().toISOString(),a:action,d:String(detail||''),u:S.me.id||'local'});if(logBusy)return;logBusy=true;
  try{while(LOGQ.length){const batch=LOGQ.splice(0);const day=today();const id=`${day}_${String(S.me.id||'local').replace(/[^A-Za-z0-9_\-.~:@+]/g,'')}`;
    if(S.mode==='db'){const ref=DB.collection('logs').doc(id);const s=await ref.get();const cur=s.exists?(s.data().entries||[]):[];await ref.set({date:day,user:S.me.id||'',entries:[...cur,...batch].slice(-1500)})}
    else{let doc=S.logs.find(x=>x.id===id);if(!doc){doc={id,date:day,entries:[]};S.logs.push(doc)}doc.entries.push(...batch);saveLocal()}}}
  catch(e){console.error(e)}logBusy=false}
async function resolveNames(ids){if(!USER)return;const need=[...new Set(ids)].filter(i=>i&&i!=='local'&&!(i in S.names));if(!need.length)return;

/* document expiry */
const DOCS_CAR=[['actExp','พ.ร.บ.'],['insExp','ประกันภัย'],['taxExp','ภาษีรถ']];
function expiries(){const t=today(),w=+cfg().expiryWarnDays||30,out=[];
  S.cars.filter(c=>c.status!=='retired').forEach(c=>DOCS_CAR.forEach(([k,l])=>{if(c[k])out.push({kind:'car',id:c.id,label:l,who:c.plate,date:c[k],left:diffDays(t,c[k])})}));

  return {all:out,warn:out.filter(x=>x.left<=w).sort((a,b)=>a.left-b.left)}}
function expChip(date){if(!date)return '<span class="muted small">—</span>';const l=diffDays(today(),date),w=+cfg().expiryWarnDays||30;

/* ---------- automatic daily rent bills ---------- */
let autoBusy=false,autoBlocked=false;
async function autoIssue(manual=false){
  const c=cfg();if((!c.autoRent&&!manual)||autoBusy||!S.ready||autoBlocked)return;
  const now=new Date(),t=today(),[hh,mm]=(c.autoTime||'06:00').split(':').map(Number);
  const end=now.getHours()*60+now.getMinutes()>=hh*60+(mm||0)?t:addDays(t,-1);
  autoBusy=true;
  try{
    let last=S.auto?.lastRun||null;
    if(S.mode==='db'){
      const ref=DB.doc('state/auto');const r=await ref.acquire({holder:SESSION,ttlMs:60000});
      if(!r.acquired){autoBusy=false;return}
      const s=await ref.get();last=s.exists?(s.data().lastRun||null):null;
    }
    let start=last?addDays(last,1):(c.autoFrom||end);
    if(c.autoFrom&&start<c.autoFrom)start=c.autoFrom;
    if(diffDays(start,end)>31)start=addDays(end,-31);
    if(start>end){if(manual)toast('ออกบิลค่าเช่าครบถึงรอบล่าสุดแล้ว');autoBusy=false;return}
    const bills=[];
    for(let day=start;day<=end;day=addDays(day,1)){
      rentDue(day).forEach(d=>{if(!rentCover(d.id,day)&&!bills.some(b=>b.driverId===d.id&&b.from===day))bills.push(makeRent(d,day,bills,'ออกบิลอัตโนมัติ'))});
    }
    for(let i=0;i<bills.length;i+=10)await Promise.all(bills.slice(i,i+10).map(b=>put('bills',b)));
    const st={lastRun:end,lastAt:new Date().toISOString(),lastCount:bills.length};
    if(S.mode==='db')await DB.doc('state/auto').set(st);else{S.auto=st;saveLocal();schedule()}
    if(bills.length){log('ออกบิลอัตโนมัติ',`${bills.length} ใบ ${fd(start)}–${fd(end)}`)}
    if(bills.length)toast(`ออกบิลค่าเช่าอัตโนมัติ ${bills.length} ใบ (${start===end?fd(end):fd(start)+' – '+fd(end)})`);
    else if(manual)toast('ไม่มีบิลที่ต้องออกเพิ่ม');
  }catch(e){console.error(e);if(e?.code==='invalid_argument'||e?.code==='not_granted'||e?.code==='permission-denied')autoBlocked=true;else if(manual)toast('ออกบิลอัตโนมัติไม่สำเร็จ ลองอีกครั้ง','bad')}
  autoBusy=false;
}
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg);return true}catch(e){console.error(e);toast(e?.code==='invalid_argument'||e?.code==='permission-denied'?'บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้':e?.code==='quota_exceeded'?'พื้นที่เก็บข้อมูลเต็ม ลบบิลเก่าที่ไม่ใช้ก่อน':'บันทึกไม่สำเร็จ ลองอีกครั้ง','bad');return false}}

   return `<div class="grid2">${ex.length?`<section class="panel"><h2>เอกสารใกล้หมดอายุ <span class="muted small">${ex.length} รายการ</span></h2>${ex.slice(0,8).map(x=>`<div class="rowline click" data-act="${x.kind==='car'?'carForm':'drvForm'}" data-id="${x.id}" style="cursor:pointer"><div class="who"><b>${esc(x.label)} · ${esc(x.who)}</b><small>หมดอายุ ${fd(x.date)}</small></div><span class="xchip ${x.left<0?'x-bad':'x-warn'}">${x.left<0?'หมดแล้ว '+(-x.left)+' วัน':'เหลือ '+x.left+' วัน'}</span></div>`).join('')}</section>`:''}
   ${off.length?`<section class="panel"><h2>งดเก็บค่าเช่าวันนี้</h2>${off.map(o=>`<div class="rowline"><div class="who"><b>${o.kind==='all'?'รถทุกคัน':o.kind==='car'?esc(C(o.carId)?.plate||''):esc(dName(o.driverId))}</b><small>${esc(o.reason||'')} · ${fd(o.from)}${o.to&&o.to!==o.from?' – '+fd(o.to):''}</small></div><span class="tag">งดเก็บ</span></div>`).join('')}</section>`:''}</div>`})()}
  <section class="panel"><h2>รับชำระรายวัน · ${ml(m)}</h2><div class="pb">${barChart(vals,vals.map((_,i)=>String(i+1)))}</div></section>

function billPage(type){
  const f=U.bill[type];
  let l=S.bills.filter(b=>b.type===type);
  if(f.month)l=l.filter(b=>b.issueDate?.startsWith(f.month));
  if(f.status!=='all')l=l.filter(b=>bSt(b)===f.status);
  if(f.q){const q=f.q.toLowerCase();l=l.filter(b=>[b.no,dName(b.driverId),C(b.carId)?.plate,b.category,b.note].join(' ').toLowerCase().includes(q))}
  l=sortBills(l);const lv=l.filter(b=>!b.void);
  const tot=lv.reduce((s,b)=>s+bDue(b),0),pd_=lv.reduce((s,b)=>s+Math.min(bPaid(b),bDue(b)),0),fees=lv.reduce((s,b)=>s+bFee(b),0);
  const desc={rent:'ออกบิลค่าเช่ารถรายวันให้คนขับ คิดตามจำนวนวันคูณค่าเช่าต่อวันของรถแต่ละคัน',insurance:'เรียกเก็บค่าประกันภัย พ.ร.บ. และประกันอื่นๆ จากคนขับ แบ่งเป็นงวดได้',other:'เรียกเก็บค่าซ่อม ค่าปรับ ค่าล้างรถ และค่าใช้จ่ายอื่นที่คนขับต้องจ่าย'}[type];
  return `<div class="ph"><div><h1>บิล${TYPE[type].t}</h1><p>${desc}</p></div><div class="acts"><button class="btn" data-act="multiPay">รับชำระหลายบิล</button>${type==='rent'?'<button class="btn" data-act="batch">ออกบิลรายวันทุกคัน</button>':''}<button class="btn pri" data-act="newBill" data-t="${type}">+ ออกบิล${TYPE[type].t}</button></div></div>
  ${kpis([{l:'จำนวนบิล',v:lv.length},{l:'ยอดเรียกเก็บ',v:'฿'+money(tot),s:fees?`รวมค่าปรับล่าช้า ฿${money(fees)}`:''},{l:'ชำระแล้ว',v:'฿'+money(pd_),c:'ok'},{l:'คงค้าง',v:'฿'+money(tot-pd_),c:tot-pd_>0?'bad':''}])}
  <div class="filters">
   <label class="fld"><span>เดือนที่ออกบิล</span><input type="month" id="f-${type}-m" data-f="bill.${type}.month" value="${f.month}"></label>
   <label class="fld"><span>สถานะ</span><select id="f-${type}-s" data-f="bill.${type}.status"><option value="all">ทั้งหมด</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="fld"><span>ค้นหา</span><input type="text" id="f-${type}-q" data-f="bill.${type}.q" value="${esc(f.q)}" placeholder="ชื่อคนขับ ทะเบียน เลขบิล"></label>
   ${f.month?`<button class="btn ghost" data-act="clrMonth" data-t="${type}">แสดงทุกเดือน</button>`:''}
  </div>
  <section class="panel">${billRows(l)}</section>`;
}
PAGES.rent=()=>billPage('rent');PAGES.insurance=()=>billPage('insurance');PAGES.other=()=>billPage('other');

PAGES.schedule=()=>{
  const m=U.sched.month,n=dim(m),t=today();
  const days=[...Array(n)].map((_,i)=>`${m}-${pad(i+1)}`);
  const rb=S.bills.filter(b=>b.type==='rent'&&!b.void&&b.from<=`${m}-${pad(n)}`&&b.to>=`${m}-01`);
  const ids=new Set(rb.map(b=>b.driverId));S.drivers.filter(d=>d.status!=='inactive'&&d.carId).forEach(d=>ids.add(d.id));
  const rows=[...ids].map(id=>D(id)||{id,name:'(ลบแล้ว)'}).sort((a,b)=>(a.code||a.name).localeCompare(b.code||b.name,'th'));
  const dayColl=Array(n).fill(0);let gB=0,gP=0,gD=0;
  const body=rows.map(d=>{let bill=0,paid=0,cnt=0;const seen=new Set();
    const cells=days.map((day,i)=>{const b=rb.find(x=>x.driverId===d.id&&x.from<=day&&day<=x.to);
      if(!b){const o=D(d.id)&&offFor(D(d.id),day);return o?`<td><span class="cell c-off" title="งดเก็บค่าเช่า: ${esc(o.reason||'')}">–</span></td>`:`<td><span class="cell c-none">·</span></td>`}
      cnt++;const per=bTotal(b)/(diffDays(b.from,b.to)+1);bill+=per;
      if(!seen.has(b.id)){seen.add(b.id);paid+=0}
      const s=bSt(b);const cls=s==='paid'?'c-paid':s==='partial'?'c-partial':s==='overdue'?'c-overdue':'c-open';
      return `<td><span class="cell ${cls}" data-act="view" data-id="${b.id}" title="${esc(b.no)} · ${ST[s]} · ฿${money(per)}">${s==='paid'?'✓':s==='partial'?'½':s==='overdue'?'!':''}</span></td>`});
    rb.filter(b=>b.driverId===d.id).forEach(b=>{const share=b.payments||[];share.forEach(p=>{const i=p.date?.startsWith(m)?+p.date.slice(8)-1:-1;if(i>=0)dayColl[i]+=+p.amount||0})});
    // paid within this month's covered days, prorated per bill
    paid=rb.filter(b=>b.driverId===d.id).reduce((s,b)=>{const tot=bTotal(b);if(!tot)return s;const nd=diffDays(b.from,b.to)+1;const inM=days.filter(x=>b.from<=x&&x<=b.to).length;return s+Math.min(bPaid(b),tot)*inM/nd},0);
    gB+=bill;gP+=paid;gD+=cnt;
    const c=carOf(d.id);
    return `<tr><td><div class="pp">${av(d.name)}<div class="who"><b>${esc(d.name)}</b><small>${esc(c?.plate||'ไม่มีรถ')}</small></div></div></td>${cells.join('')}<td class="r num">${cnt}</td><td class="r num">${money(bill)}</td><td class="r num">${money(paid)}</td><td class="r num" style="color:${bill-paid>0.5?'var(--bad)':'inherit'}">${money(bill-paid)}</td></tr>`}).join('');
  return `<div class="ph"><div><h1>ตารางจ่ายค่าเช่ารายเดือน</h1><p>ดูการชำระค่าเช่ารายวันของคนขับทุกคนในเดือนเดียว กดช่องสีเพื่อเปิดบิล</p></div>
   <div class="acts"><button class="btn" data-act="mShift" data-d="-1">‹ เดือนก่อน</button><input type="month" id="sch-m" data-f="sched.month" value="${m}"><button class="btn" data-act="mShift" data-d="1">เดือนถัดไป ›</button></div></div>
  ${kpis([{l:'วันที่เรียกเก็บ',v:gD,s:'วัน-คัน'},{l:'ค่าเช่าเดือนนี้',v:'฿'+money(gB)},{l:'ชำระแล้ว',v:'฿'+money(gP),c:'ok'},{l:'คงค้าง',v:'฿'+money(gB-gP),c:gB-gP>0.5?'bad':''}])}
  <div class="legend" style="margin:14px 0 10px"><span><span class="cell c-paid">✓</span>ชำระแล้ว</span><span><span class="cell c-partial">½</span>ชำระบางส่วน</span><span><span class="cell c-open"></span>รอชำระ</span><span><span class="cell c-overdue">!</span>เกินกำหนด</span><span><span class="cell c-off">–</span>งดเก็บค่าเช่า</span><span><span class="cell c-none">·</span>ไม่มีบิล</span></div>
  <section class="panel">${rows.length?`<div class="tw"><table class="sched"><thead><tr><th>คนขับ / รถ</th>${days.map(x=>{const dw=pd(x).getDay();return `<th class="${dw===0||dw===6?'we':''} ${x===t?'td':''}">${+x.slice(8)}<div class="small muted">${TH_D[dw]}</div></th>`}).join('')}<th class="r">วัน</th><th class="r">ค่าเช่า</th><th class="r">ชำระ</th><th class="r">คงค้าง</th></tr></thead>
  <tbody>${body}</tbody><tfoot><tr><td>รับชำระรายวัน (บาท)</td>${dayColl.map(v=>`<td class="num small">${v?Math.round(v).toLocaleString('th-TH'):''}</td>`).join('')}<td class="r num">${gD}</td><td class="r num">${money(gB)}</td><td class="r num">${money(gP)}</td><td class="r num">${money(gB-gP)}</td></tr></tfoot></table></div>`:'<div class="empty"><b>ยังไม่มีข้อมูลค่าเช่าในเดือนนี้</b>ออกบิลค่าเช่ารายวันก่อน ตารางจะแสดงขึ้นอัตโนมัติ</div>'}</section>`;
};

    R.cur={name:`รายรับ-${r.from}-${r.to}`,head:['วันที่รับ','เลขที่บิล','ประเภท','คนขับ','วิธีชำระ','อ้างอิง','จำนวนเงิน'],rows:ps.map(p=>[p.date,p.bill.no,TYPE[p.bill.type].t,dName(p.bill.driverId),p.method,p.note||'',+p.amount])};

    <div class="stack">${kpis([{l:'รับชำระรวม',v:'฿'+money(tot),s:`${ps.length} รายการ`,c:'ok'},...Object.entries(byT).map(([k,v])=>({l:TYPE[k].t,v:'฿'+money(v)}))])}
    <div class="muted small">แยกตามวิธีชำระ: ${Object.entries(byM).filter(([,v])=>v).map(([k,v])=>`${k} ฿${money(v)}`).join(' · ')||'—'}</div>
    <section class="panel"><h2>รายการรับชำระ <button class="btn sm" data-act="csv">ดาวน์โหลด CSV</button></h2>${ps.length?`<div class="tw"><table><thead><tr><th>วันที่รับ</th><th>เลขที่บิล</th><th>ประเภท</th><th>คนขับ</th><th>วิธีชำระ</th><th>อ้างอิง</th><th class="r">จำนวนเงิน</th></tr></thead><tbody>
    ${ps.map(p=>`<tr class="click" data-act="view" data-id="${p.bill.id}"><td class="nowrap">${fd(p.date)}</td><td class="num">${esc(p.bill.no)}</td><td>${TYPE[p.bill.type].t}</td><td>${esc(dName(p.bill.driverId))}</td><td>${esc(p.method)}</td><td class="small muted">${esc(p.note||'')}</td><td class="r num">${money(p.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="6">รวม</td><td class="r num">${money(tot)}</td></tr></tfoot></table></div>`:'<div class="empty"><b>ไม่มีการรับชำระในช่วงนี้</b></div>'}</section></div>`;
  }
  if(r.tab==='car'){
    const m=r.month,n=dim(m),s0=`${m}-01`,s1=`${m}-${pad(n)}`;
    const rows=S.cars.map(c=>{const bl=live().filter(b=>b.carId===c.id);const rent=bl.filter(b=>b.type==='rent'&&b.from<=s1&&b.to>=s0);
      const days=rent.reduce((s,b)=>s+Math.max(0,diffDays(b.from<s0?s0:b.from,b.to>s1?s1:b.to)+1),0);
      const rentAmt=rent.reduce((s,b)=>{const nd=diffDays(b.from,b.to)+1;const inM=Math.max(0,diffDays(b.from<s0?s0:b.from,b.to>s1?s1:b.to)+1);return s+bTotal(b)*inM/nd},0);
      const ins=bl.filter(b=>b.type==='insurance'&&b.issueDate?.startsWith(m)).reduce((s,b)=>s+bTotal(b),0);
      const oth=bl.filter(b=>b.type==='other'&&b.issueDate?.startsWith(m)).reduce((s,b)=>s+bTotal(b),0);
      const coll=allPays().filter(p=>p.bill.carId===c.id&&p.date?.startsWith(m)).reduce((s,p)=>s+(+p.amount||0),0);
      return {c,days,util:days/n,rentAmt,ins,oth,coll}});
    R.cur={name:`สรุปตามรถ-${m}`,head:['ทะเบียน','คนขับปัจจุบัน','วันที่เช่า','อัตราใช้งาน%','ค่าเช่า','ค่าประกัน','ค่าอื่นๆ','รับชำระ'],rows:rows.map(x=>[x.c.plate,driverOn(x.c.id)?.name||'',x.days,Math.round(x.util*100),r2(x.rentAmt),x.ins,x.oth,x.coll])};
    body=`<div class="filters"><label class="fld"><span>เดือน</span><input type="month" id="rp-m2" data-f="rep.month" value="${m}"></label></div>
    <section class="panel"><h2>สรุปรายได้ตามรถ · ${ml(m)} <button class="btn sm" data-act="csv">ดาวน์โหลด CSV</button></h2>${rows.length?`<div class="tw"><table><thead><tr><th>รถ</th><th>คนขับปัจจุบัน</th><th class="r">วันที่มีค่าเช่า</th><th class="r">อัตราใช้งาน</th><th class="r">ค่าเช่า</th><th class="r">ค่าประกัน</th><th class="r">ค่าอื่นๆ</th><th class="r">รับชำระ</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${plate(x.c)}</td><td>${esc(driverOn(x.c.id)?.name||'—')}</td><td class="r num">${x.days}/${n}</td><td class="r num">${Math.round(x.util*100)}%</td><td class="r num">${money(x.rentAmt)}</td><td class="r num">${money(x.ins)}</td><td class="r num">${money(x.oth)}</td><td class="r num">${money(x.coll)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>ยังไม่มีรถในระบบ</b></div>'}</section>`;
  }
  return `<div class="ph"><div><h1>รายงาน</h1><p>สรุปยอดเรียกเก็บ รับชำระ และค้างชำระ ดาวน์โหลดเป็นไฟล์ CSV เปิดใน Excel ได้</p></div></div>
  <div class="tabs">${tabs.map(([k,t])=>`<a data-act="repTab" data-k="${k}" class="${r.tab===k?'on':''}">${t}</a>`).join('')}</div>${body}`;
};
const R={cur:null};

PAGES.swap=()=>{
  const f=U.swap;const cars=S.cars.filter(c=>c.status!=='retired');
  const car=C(f.carId),old=car?driverOn(car.id):null,nd=D(f.newId);
  const other=nd&&nd.carId&&nd.carId!==f.carId?C(nd.carId):null;
  const oldBal=old?live().filter(b=>b.driverId===old.id).reduce((s,b)=>s+bBal(b),0):0;
  let info='';
  if(car&&nd){info=other?`<div class="note">สลับรถกัน: <b>${esc(nd.name)}</b> ย้ายจาก ${esc(other.plate)} มาขับ ${esc(car.plate)} ${old?`และ <b>${esc(old.name)}</b> ย้ายไปขับ ${esc(other.plate)}`:`ส่วน ${esc(other.plate)} จะว่าง`}</div>`
    :`<div class="note"><b>${esc(nd.name)}</b> รับรถ ${esc(car.plate)} ตั้งแต่ ${fd(f.date)}${old?` แทน <b>${esc(old.name)}</b> ซึ่งจะไม่มีรถประจำ`:''}</div>`}
  if(old&&oldBal>0)info+=`<div class="note bad">${esc(old.name)} ยังค้างชำระ ฿${money(oldBal)} ควรเคลียร์ยอดก่อนหรือบันทึกไว้ในหมายเหตุ</div>`;
  const hist=S.swaps.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  return `<div class="ph"><div><h1>สลับเปลี่ยนคนขับ</h1><p>เปลี่ยนคนขับประจำรถ หรือสลับรถระหว่างคนขับสองคน บิลค่าเช่าวันถัดไปจะออกให้คนขับใหม่ตามรถที่ผูกไว้</p></div></div>
  <div class="grid2">
  <section class="panel"><h2>เปลี่ยนคนขับ</h2><div class="pb stack">
   <div class="frm">
    <label class="fld full"><span>รถ</span><select id="sw-car" data-f="swap.carId"><option value="">— เลือกรถ —</option>${cars.map(c=>`<option value="${c.id}" ${f.carId===c.id?'selected':''}>${esc(c.plate)} · ${esc(driverOn(c.id)?.name||'ว่าง')}</option>`).join('')}</select></label>
    <div class="fld full"><span>คนขับปัจจุบัน</span><div>${car?(old?`<b>${esc(old.name)}</b> <span class="muted small">${esc(old.phone||'')}</span>`:'<span class="muted">รถว่าง ไม่มีคนขับ</span>'):'<span class="muted">เลือกรถก่อน</span>'}</div></div>
    <label class="fld full"><span>คนขับใหม่</span><select id="sw-new" data-f="swap.newId"><option value="">— เลือกคนขับ —</option>${S.drivers.filter(d=>d.status!=='inactive'&&d.id!==old?.id).map(d=>`<option value="${d.id}" ${f.newId===d.id?'selected':''}>${esc(d.name)} · ${d.carId?'ขับ '+esc(C(d.carId)?.plate||''):'ยังไม่มีรถ'}</option>`).join('')}</select></label>
    <label class="fld"><span>วันที่มีผล</span><input type="date" id="sw-date" data-f="swap.date" value="${f.date}"></label>
    <label class="fld"><span>เหตุผล</span><select id="sw-reason" data-f="swap.reason">${['คนขับใหม่เข้าทำงาน','สลับรถ/สลับกะ','คนขับเดิมลาออก','คนขับเดิมพักงาน','รถเดิมเข้าซ่อม','อื่นๆ'].map(x=>`<option ${f.reason===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label class="fld full"><span>หมายเหตุ</span><input type="text" id="sw-note" data-f="swap.note" data-rr="0" value="${esc(f.note)}"></label>
    ${old&&!other?`<label class="chk full"><input type="checkbox" id="sw-end" data-f="swap.endOld" ${f.endOld?'checked':''}> ปิดสถานะ ${esc(old.name)} เป็น "ไม่ใช้งาน"</label>`:''}
   </div>${info}
   <div><button class="btn pri" data-act="doSwap" ${car&&nd?'':'disabled'}>ยืนยันเปลี่ยนคนขับ</button></div>
  </div></section>
  <section class="panel"><h2>คนขับประจำรถตอนนี้</h2>${cars.length?cars.map(c=>{const d=driverOn(c.id);return `<div class="rowline">${plate(c)}<div class="who" style="text-align:right"><b>${d?esc(d.name):'<span class="muted">ว่าง</span>'}</b><small>${d?'ตั้งแต่ '+fd(d.since||d.startDate):CAR_ST[c.status||'active']}</small></div></div>`}).join(''):'<div class="empty"><b>ยังไม่มีรถ</b></div>'}</section>
  </div>
  <section class="panel" style="margin-top:16px"><h2>ประวัติการเปลี่ยนคนขับ</h2>${hist.length?`<div class="tw"><table><thead><tr><th>วันที่มีผล</th><th>รถ</th><th>คนขับเดิม</th><th>คนขับใหม่</th><th>รูปแบบ</th><th>เหตุผล</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>
   ${hist.map(h=>`<tr><td class="nowrap">${fd(h.date)}</td><td>${plate(C(h.carId))}</td><td>${esc(h.fromDriverId?dName(h.fromDriverId):'—')}</td><td><b>${esc(dName(h.toDriverId))}</b></td><td>${h.mode==='swap'?`<span class="tag">สลับกับ ${esc(C(h.otherCarId)?.plate||'')}</span>`:'<span class="tag">เปลี่ยนคนขับ</span>'}</td><td>${esc(h.reason)}</td><td class="small muted">${esc(h.note||'')}</td><td>${(()=>{const o=D(h.fromDriverId);return o&&!o.settlement&&+o.deposit>0&&!o.carId&&mgr()?`<button class="btn sm" data-act="settle" data-id="${o.id}">คืนเงินประกัน</button>`:''})()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>ยังไม่มีการเปลี่ยนคนขับ</b>ประวัติจะแสดงที่นี่หลังกดยืนยัน</div>'}</section>`;
};

/* ---------- modal ---------- */
const M={calc:null};
function openModal(html,cls=''){document.getElementById('modal').innerHTML=`<div class="ov" data-act="ovClose"><div class="mod ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector('.mod input:not([type=hidden]),.mod select');if(f)f.focus()}
function closeModal(){document.getElementById('modal').innerHTML='';M.calc=null}
function confirmBox(msg,ok='ยืนยัน',danger=false){return new Promise(res=>{openModal(`<header><h3>ยืนยัน</h3></header><div class="mb"><div>${msg}</div></div><footer><button class="btn" id="cfNo">ยกเลิก</button><button class="btn ${danger?'dng':'pri'}" id="cfOk">${ok}</button></footer>`,'narrow');
  document.getElementById('cfNo').onclick=()=>{closeModal();res(false)};document.getElementById('cfOk').onclick=()=>{closeModal();res(true)}})}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const hdr=t=>`<header><h3>${t}</h3><button class="btn ghost" data-act="close" aria-label="ปิด">✕</button></header>`;

/* bill form */
function itemRow(i={desc:'',qty:1,price:''}){return `<div class="row"><input type="text" class="it-d" value="${esc(i.desc)}" placeholder="รายละเอียด" data-calc><input type="number" class="it-q" min="0" step="any" value="${i.qty}" data-calc><input type="number" class="it-p" min="0" step="0.01" value="${i.price}" placeholder="ราคา" data-calc><button type="button" class="btn sm ghost" data-act="rmItem" aria-label="ลบรายการ">✕</button></div>`}
function billForm(type,b){
  const c=cfg(),t=today(),isNew=!b;
  b=b||{type,issueDate:t,dueDate:addDays(t,type==='rent'?+c.rentDueDays:+c.otherDueDays),from:t,to:t,discount:0,items:[]};
  const drivers=S.drivers.filter(d=>d.status!=='inactive'||d.id===b.driverId);
  const cats=type==='insurance'?c.insuranceTypes:c.otherTypes;
  const rate=b.items?.[0]?.price??'';
  openModal(`${hdr((isNew?'ออกบิล':'แก้ไขบิล ')+(isNew?TYPE[type].t:b.no))}<form id="billForm"><div class="mb">
   <div class="frm">
    <label class="fld"><span>คนขับ</span><select name="driverId" id="bf-drv" required data-calc="drv"><option value="">— เลือกคนขับ —</option>${drivers.map(d=>`<option value="${d.id}" ${b.driverId===d.id?'selected':''}>${esc(d.name)}${d.carId?' · '+esc(C(d.carId)?.plate||''):''}</option>`).join('')}</select></label>
    <label class="fld"><span>รถ</span><select name="carId" id="bf-car" data-calc="car"><option value="">— ไม่ระบุ —</option>${S.cars.map(x=>`<option value="${x.id}" ${b.carId===x.id?'selected':''}>${esc(x.plate)}</option>`).join('')}</select></label>
    <label class="fld"><span>วันที่ออกบิล</span><input type="date" name="issueDate" value="${b.issueDate}" required></label>
    <label class="fld"><span>กำหนดชำระ</span><input type="date" name="dueDate" value="${b.dueDate||''}"></label>
    ${type==='rent'?`
    <label class="fld"><span>เช่าตั้งแต่วันที่</span><input type="date" name="from" value="${b.from}" required data-calc="date"></label>
    <label class="fld"><span>ถึงวันที่</span><input type="date" name="to" value="${b.to}" required data-calc="date"></label>
    <label class="fld"><span>ค่าเช่าต่อวัน (บาท)</span><input type="number" name="rate" id="bf-rate" min="0" step="0.01" value="${rate}" required data-calc="rate"></label>`:`
    <label class="fld"><span>ประเภท</span><select name="category" id="bf-cat" data-calc="cat">${cats.map(x=>`<option ${b.category===x?'selected':''}>${esc(x)}</option>`).join('')}${b.category&&!cats.includes(b.category)?`<option selected>${esc(b.category)}</option>`:''}</select></label>
    <label class="fld"><span>${type==='insurance'?'งวด / ระยะคุ้มครอง':'อ้างอิง'}</span><input type="text" name="period" value="${esc(b.period||'')}" placeholder="${type==='insurance'?'เช่น งวด 3/12 หรือ ต.ค. 2569':'เช่น ใบสั่งซ่อมเลขที่'}"></label>
    <div class="fld full items"><span>รายการ</span><div id="items">${(b.items?.length?b.items:[{desc:cats[0]||'',qty:1,price:''}]).map(itemRow).join('')}</div><div><button type="button" class="btn sm" data-act="addItem">+ เพิ่มรายการ</button></div></div>`}
    <label class="fld"><span>ส่วนลด (บาท)</span><input type="number" name="discount" min="0" step="0.01" value="${b.discount||0}" data-calc></label>
    <label class="fld full"><span>หมายเหตุ</span><input type="text" name="note" value="${esc(b.note||'')}"></label>
   </div>
   <div class="calc"><span id="calcDesc" class="muted"></span><span class="tot" id="calcTot">฿0.00</span></div>
   ${b.payments?.length?`<div class="note">บิลนี้รับชำระแล้ว ฿${money(bPaid(b))} ยอดรวมใหม่ต้องไม่น้อยกว่ายอดที่ชำระ</div>`:''}
   <div class="err" id="bfErr"></div>
  </div><footer><button type="button" class="btn" data-act="close">ยกเลิก</button><button class="btn pri" type="submit">${isNew?'ออกบิล':'บันทึก'}</button></footer></form>`);
  const F=document.getElementById('billForm');
  M.calc=(src)=>{
    if(src==='drv'){const d=D(F.driverId.value);if(d?.carId){F.carId.value=d.carId;src='car'}}
    if(src==='car'&&type==='rent'){const car=C(F.carId.value);if(car)F.rate.value=car.dailyRate}
    if(src==='cat'){const first=F.querySelector('.it-d');if(first&&(!first.value||[...cats].includes(first.value)))first.value=F.category.value}
    let tot=0,desc='';
    if(type==='rent'){const ok=F.from.value&&F.to.value&&F.to.value>=F.from.value;const rr=ok?rangeRent(D(F.driverId.value),F.from.value,F.to.value,+F.rate.value||0):{days:0,off:0,disc:0,names:[]};
      if(isNew&&['drv','car','date','rate'].includes(src)){F.discount.value=rr.disc;M.camp=rr.disc?rr.names.join(', '):''}
      const n=rr.days;tot=Math.max(0,n)*(+F.rate.value||0)-(+F.discount.value||0);
      desc=ok?`${n} วัน × ฿${money(F.rate.value)}${rr.off?` (งดเก็บ ${rr.off} วัน)`:''}${+F.discount.value?` − ส่วนลด ฿${money(F.discount.value)}${M.camp?' แคมเปญ '+M.camp:''}`:''}`:'ช่วงวันที่ไม่ถูกต้อง'}
    else{const rows=[...F.querySelectorAll('#items .row')];tot=rows.reduce((s,r)=>s+(+r.querySelector('.it-q').value||0)*(+r.querySelector('.it-p').value||0),0)-(+F.discount.value||0);desc=`${rows.length} รายการ${+F.discount.value?` − ส่วนลด ฿${money(F.discount.value)}`:''}`}
    document.getElementById('calcTot').textContent='฿'+money(Math.max(0,tot));document.getElementById('calcDesc').textContent=desc+' · '+bahtText(Math.max(0,tot));
  };
  M.camp='';M.calc(isNew?'date':undefined);
  F.onsubmit=async e=>{e.preventDefault();const err=document.getElementById('bfErr');err.textContent='';
    const nb={...b,type,driverId:F.driverId.value,carId:F.carId.value||null,issueDate:F.issueDate.value,dueDate:F.dueDate.value||null,discount:+F.discount.value||0,note:F.note.value.trim()};
    if(!nb.driverId){err.textContent='เลือกคนขับก่อนออกบิล';return}
    if(type==='rent'){if(diffDays(F.from.value,F.to.value)<0){err.textContent='วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มเช่า';return}const rr=rangeRent(D(nb.driverId),F.from.value,F.to.value,+F.rate.value||0);const n=rr.days;if(n<1){err.textContent='ทุกวันในช่วงนี้เป็นวันงดเก็บค่าเช่า';return}if(isNew&&M.camp&&+F.discount.value)nb.campaign=M.camp;
      const clash=S.bills.find(x=>x.id!==b.id&&x.type==='rent'&&!x.void&&x.driverId===nb.driverId&&x.from<=F.to.value&&x.to>=F.from.value);
      if(clash){err.textContent=`ช่วงวันที่ซ้ำกับบิล ${clash.no} (${fd(clash.from)} – ${fd(clash.to)})`;return}
      nb.from=F.from.value;nb.to=F.to.value;const car=C(nb.carId);
      nb.items=[{desc:`ค่าเช่ารถ ${car?car.plate:''} ${fd(nb.from)}${nb.from!==nb.to?' – '+fd(nb.to):''}`.replace(/\s+/g,' '),qty:n,price:+F.rate.value||0}];
    }else{nb.category=F.category.value;nb.period=F.period.value.trim();
      nb.items=[...F.querySelectorAll('#items .row')].map(r=>({desc:r.querySelector('.it-d').value.trim(),qty:+r.querySelector('.it-q').value||0,price:+r.querySelector('.it-p').value||0})).filter(i=>i.desc||i.price);
      if(!nb.items.length){err.textContent='ใส่อย่างน้อย 1 รายการ';return}}
    if(bTotal(nb)<=0){err.textContent='ยอดรวมต้องมากกว่า 0';return}
    if(bPaid(nb)>bTotal(nb)+0.004){err.textContent='ยอดรวมใหม่น้อยกว่ายอดที่ชำระแล้ว';return}
    if(isNew){nb.no=nextNo(type,nb.issueDate);nb.payments=[];nb.lateRule=ruleFor(type);nb.createdAt=new Date().toISOString()}
    nb.updatedAt=new Date().toISOString();
    let saved;const ok=await safe(async()=>{saved=await put('bills',nb)},isNew?`ออกบิล ${nb.no} แล้ว`:'บันทึกแล้ว');
    if(ok){log(isNew?'ออกบิล':'แก้ไขบิล',`${nb.no} ${dName(nb.driverId)} ฿${money(bTotal(nb))}`);closeModal();setTimeout(()=>viewBill(saved.id,saved),60)}
  };
}

/* invoice */

  const sub=(b.items||[]).reduce((x,i)=>x+(+i.qty||0)*(+i.price||0),0);
  return `<div class="inv"><div class="top"><div class="co"><b>${esc(c.company)}</b>${c.address?`<div class="small">${esc(c.address)}</div>`:''}<div class="small muted">${[c.phone&&'โทร '+c.phone,c.taxId&&'เลขผู้เสียภาษี '+c.taxId].filter(Boolean).map(esc).join(' · ')}</div></div>
   <div class="doc"><div class="t">${TYPE[b.type].doc}</div><div class="num">เลขที่ ${esc(b.no)}</div><div style="margin-top:6px">${s==='paid'?'<span class="stamp" style="color:var(--ok)">ชำระแล้ว</span>':s==='void'?'<span class="stamp" style="color:var(--void)">ยกเลิก</span>':pill(s)}</div></div></div>
   <div class="meta"><div><span>คนขับ</span><b>${esc(d?.name||'—')}</b></div><div><span>วันที่ออกบิล</span>${fd(b.issueDate)}</div><div><span>รถ</span>${esc(car?.plate||'—')} ${esc(car?.province||'')}</div><div><span>กำหนดชำระ</span>${fd(b.dueDate)}</div>${d?.phone?`<div><span>โทร</span>${esc(d.phone)}</div>`:''}${b.category?`<div><span>ประเภท</span>${esc(b.category)}${b.period?' · '+esc(b.period):''}</div>`:''}</div>
   <div class="tw"><table><thead><tr><th>รายการ</th><th class="r">จำนวน</th><th class="r">ราคา/หน่วย</th><th class="r">จำนวนเงิน</th></tr></thead><tbody>
   ${(b.items||[]).map(i=>`<tr><td>${esc(i.desc)}</td><td class="r num">${i.qty}${b.type==='rent'?' วัน':''}</td><td class="r num">${money(i.price)}</td><td class="r num">${money((+i.qty||0)*(+i.price||0))}</td></tr>`).join('')}
   ${+b.discount?`<tr><td colspan="3" class="r">รวม</td><td class="r num">${money(sub)}</td></tr><tr><td colspan="3" class="r">ส่วนลด</td><td class="r num">−${money(b.discount)}</td></tr>`:''}
   ${L.fee?`<tr><td colspan="3" class="r">ค่าปรับชำระล่าช้า ${L.days} วัน <span class="muted small">(${R.mode==='flat'?'เหมา':R.mode==='percent'?R.amount+'%/วัน':R.amount+' บาท/วัน'}${R.grace?` ผ่อนผัน ${R.grace} วัน`:''}${R.cap?` สูงสุด ${money(R.cap)}`:''})</span></td><td class="r num">${money(L.fee)}</td></tr>`:''}
   ${b.waiveLate?`<tr><td colspan="3" class="r muted">ยกเว้นค่าปรับชำระล่าช้า</td><td class="r num muted">0.00</td></tr>`:''}
   </tbody><tfoot><tr><td colspan="3" class="r">ยอดเรียกเก็บสุทธิ</td><td class="r num">${money(tot)}</td></tr></tfoot></table></div>
   <div class="words">(${bahtText(tot)})</div>
   ${b.note?`<div class="small" style="margin-top:8px"><span class="muted">หมายเหตุ:</span> ${esc(b.note)}</div>`:''}
   ${b.void?`<div class="small" style="margin-top:8px;color:var(--bad)">ยกเลิกเมื่อ ${fd(b.voidDate)} ${esc(b.voidReason||'')}</div>`:''}

}

   ${(b.payments||[]).length?`<div class="tw"><table><thead><tr><th>วันที่</th><th>ใบเสร็จ</th><th>วิธี</th><th>อ้างอิง</th><th class="r">จำนวนเงิน</th><th></th></tr></thead><tbody>${b.payments.map(p=>`<tr><td>${fd(p.date)}</td><td>${p.receiptNo?`<a class="lnk num" data-act="receipt" data-no="${esc(p.receiptNo)}">${esc(p.receiptNo)}</a>`:'<span class="muted">—</span>'}</td><td>${esc(p.method)}</td><td class="small muted">${esc(p.note||'')}</td><td class="r num">${money(p.amount)}</td><td>${mgr()?`<button class="btn sm ghost" data-act="rmPay" data-id="${b.id}" data-p="${p.id}" aria-label="ลบรายการชำระ">✕</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">ยังไม่มีการชำระ</div>'}</section>

  ${l.map(r=>`<tr class="click" data-act="receipt" data-no="${esc(r.no)}"><td class="num">${esc(r.no)}</td><td class="nowrap">${fd(r.date)}</td><td><div class="pp">${av(dName(r.driverId))}<span>${esc(dName(r.driverId))}</span></div></td><td class="small">${r.items.map(i=>esc(i.bill.no)).join(', ')}</td><td>${esc(r.method||'')}</td><td class="small">${esc(who(r.by))}</td><td class="r num">${money(r.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>ยังไม่มีใบเสร็จในเดือนนี้</b>ใบเสร็จจะออกอัตโนมัติเมื่อกดรับชำระ</div>'}</section>`};

function openBills(did){return live().filter(b=>b.driverId===did&&bBal(b)>0).sort((a,b)=>((a.dueDate||a.issueDate)+a.no).localeCompare((b.dueDate||b.issueDate)+b.no))}
function multiPay(did){

  openModal(`${hdr('รับชำระหลายบิล')}<form id="mpF"><div class="mb">
   <div class="frm"><label class="fld full"><span>คนขับ</span><select name="driverId" id="mp-d"><option value="">— เลือกคนขับที่มียอดค้าง —</option>${ds.map(d=>`<option value="${d.id}" ${d.id===did?'selected':''}>${esc(d.name)} · ค้าง ฿${money(openBills(d.id).reduce((s,b)=>s+bBal(b),0))}</option>`).join('')}</select></label></div>
   <div id="mpList"></div>
   <div class="frm"><label class="fld"><span>จำนวนเงินที่รับ</span><input type="number" name="amount" id="mp-amt" min="0.01" step="0.01"></label>

    <label class="fld"><span>วิธีชำระ</span><select name="method">${METHODS.filter(m=>m!=='หักจากเงินประกัน').map(m=>`<option>${m}</option>`).join('')}</select></label>
    <label class="fld"><span>อ้างอิง / หมายเหตุ</span><input type="text" name="note" placeholder="เช่น เลขที่สลิปโอน"></label></div>
   <div id="mpAlloc"></div><div id="mpQR"></div><div class="err" id="mpErr"></div>
  </div><footer><button type="button" class="btn" data-act="close">ยกเลิก</button><button class="btn pri" id="mpGo">บันทึกรับชำระ</button></footer></form>`);
  const F=document.getElementById('mpF');let touched=false;
  const sel=()=>[...F.querySelectorAll('.mp-b:checked')].map(x=>S.bills.find(b=>b.id===x.value)).filter(Boolean);
  const alloc=()=>{let left=r2(+F.amount.value||0);return sel().map(b=>{const a=Math.min(left,bBal(b));left=r2(left-a);return {b,a:r2(a)}})};
  const drawAlloc=()=>{const al=alloc(),amt=+F.amount.value||0,max=sel().reduce((s,b)=>s+bBal(b),0);
    document.getElementById('mpAlloc').innerHTML=al.length?`<div class="calc"><span>ตัดยอดบิลเก่าสุดก่อน: ${al.filter(x=>x.a>0).map(x=>`${esc(x.b.no)} ฿${money(x.a)}${x.a<bBal(x.b)?' (บางส่วน)':''}`).join(' · ')||'—'}</span><span class="tot">฿${money(amt)}</span></div>${amt>max+0.004?`<div class="note bad">ยอดที่รับเกินยอดค้างของบิลที่เลือก ฿${money(max)}</div>`:''}`:'';
    document.getElementById('mpQR').innerHTML=amt>0?ppBlock(amt):''};
  const drawList=()=>{const d=F.driverId.value,l=d?openBills(d):[];
    document.getElementById('mpList').innerHTML=d?(l.length?`<div class="panel"><div class="tw"><table><thead><tr><th></th><th>เลขที่บิล</th><th>รายการ</th><th>ครบกำหนด</th><th class="r">คงค้าง</th></tr></thead><tbody>${l.map(b=>`<tr><td><input type="checkbox" class="mp-b" value="${b.id}" checked aria-label="เลือกบิล ${esc(b.no)}"></td><td class="num">${esc(b.no)}</td><td class="small">${TYPE[b.type].t} · ${esc(billDesc(b))}</td><td class="nowrap">${fd(b.dueDate)} ${pill(bSt(b))}</td><td class="r num">${money(bBal(b))}${bFee(b)?`<div class="small" style="color:var(--bad)">รวมปรับ ${money(bFee(b))}</div>`:''}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="note">คนขับคนนี้ไม่มียอดค้าง</div>'):'';
    touched=false;F.amount.value=r2(sel().reduce((s,b)=>s+bBal(b),0))||'';drawAlloc()};
  F.driverId.onchange=drawList;
  F.addEventListener('change',e=>{if(e.target.classList.contains('mp-b')){if(!touched)F.amount.value=r2(sel().reduce((s,b)=>s+bBal(b),0))||'';drawAlloc()}});
  F.amount.oninput=()=>{touched=true;drawAlloc()};drawList();
  F.onsubmit=async e=>{e.preventDefault();const err=document.getElementById('mpErr');err.textContent='';
    const amt=r2(+F.amount.value||0),al=alloc().filter(x=>x.a>0),max=sel().reduce((s,b)=>s+bBal(b),0);
    if(!F.driverId.value){err.textContent='เลือกคนขับก่อน';return}if(!al.length||amt<=0){err.textContent='เลือกบิลและใส่จำนวนเงิน';return}
    if(amt>max+0.004){err.textContent='จำนวนเงินเกินยอดค้างของบิลที่เลือก';return}
    const rc=nextReceipt();document.getElementById('mpGo').disabled=true;
    const ok=await safe(async()=>{for(const x of al){const cur=S.bills.find(b=>b.id===x.b.id);await put('bills',{...cur,payments:[...(cur.payments||[]),{id:uid(),amount:x.a,date:F.date.value,method:F.method.value,note:F.note.value.trim(),receiptNo:rc,by:S.me.id||'local'}],updatedAt:new Date().toISOString()})}},`รับชำระ ฿${money(amt)} ${al.length} บิล · ใบเสร็จ ${rc}`);
    if(ok){log('รับชำระหลายบิล',`${rc} ${dName(F.driverId.value)} ฿${money(amt)} ${al.length} บิล`);closeModal();setTimeout(()=>viewReceipt(rc),100)}else document.getElementById('mpGo').disabled=false};
}

   <div id="stCalc"></div><div class="err" id="stErr"></div>
  </div><footer><button type="button" class="btn" data-act="close">ยกเลิก</button><button class="btn pri" id="stGo">ยืนยันปิดบัญชี</button></footer></form>`);
  const F=document.getElementById('stF');const outTot=r2(ob.reduce((s,b)=>s+bBal(b),0));
  const extras=()=>[...F.querySelectorAll('#items .row')].map(r=>({desc:r.querySelector('.it-d').value.trim(),qty:+r.querySelector('.it-q').value||0,price:+r.querySelector('.it-p').value||0})).filter(i=>i.desc&&i.qty*i.price>0);
  const calc=()=>{const ex=r2(extras().reduce((s,i)=>s+i.qty*i.price,0)),need=r2(outTot+ex),ded=Math.min(dep,need),refund=r2(Math.max(0,dep-need)),debt=r2(Math.max(0,need-dep));
    document.getElementById('stCalc').innerHTML=`<div class="panel"><div class="rowline"><span>ยอดค้างชำระ</span><span class="num">฿${money(outTot)}</span></div><div class="rowline"><span>รายการหักเพิ่ม</span><span class="num">฿${money(ex)}</span></div><div class="rowline"><span>หักจากเงินประกัน</span><span class="num">฿${money(ded)}</span></div><div class="rowline"><b>คืนเงินให้คนขับ</b><b class="num" style="color:var(--ok);font-size:18px">฿${money(refund)}</b></div>${debt?`<div class="rowline"><b style="color:var(--bad)">ยอดที่คนขับยังต้องชำระเพิ่ม</b><b class="num" style="color:var(--bad)">฿${money(debt)}</b></div>`:''}</div>`;return {ex,ded,refund,debt}};
  M.calc=calc;F.addEventListener('input',calc);calc();
  F.onsubmit=async e=>{e.preventDefault();const k=calc(),ex=extras(),date=F.date.value;
    if(!await confirmBox(`ปิดบัญชี ${esc(d.name)} หักเงินประกัน ฿${money(k.ded)} และคืนเงิน ฿${money(k.refund)}?`,'ยืนยันปิดบัญชี')){settleForm(did);return}

      const targets=[...openBills(did)];
      if(ex.length){const nb={type:'other',driverId:did,carId:d.carId||null,issueDate:date,dueDate:date,category:'หักเงินประกันตอนปิดบัญชี',period:'',discount:0,items:ex,payments:[],lateRule:null,note:'ออกตอนปิดบัญชีคนขับ',createdAt:new Date().toISOString()};nb.no=nextNo('other',date);const saved=await put('bills',nb);targets.push(saved)}

    },'ปิดบัญชีเรียบร้อย');
    if(ok){log('ปิดบัญชีคนขับ',`${d.name} หัก ฿${money(k.ded)} คืน ฿${money(k.refund)}`);closeModal();setTimeout(()=>settleView(did),100)}};
}

/* ---------- Firebase mode (office system hosted outside Claude) ---------- */
const FBV='10.12.2';let FB=null;S.payreq=[];S.requests=[];S.staff=[];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const normPhone=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('66'))p='0'+p.slice(2);return p};
function fsAdapter(fs){const wrap=r=>{r.acquire=async({holder,ttlMs=30000})=>{try{return await fs.runTransaction(async tx=>{const s=await tx.get(r);const l=s.exists?s.data().lease:null;if(l&&l.exp>Date.now()&&l.holder!==holder)return {acquired:false};tx.set(r,{lease:{holder,exp:Date.now()+ttlMs}},{merge:true});return {acquired:true}})}catch(e){console.error(e);return {acquired:false}}};return r};
  return {collection:p=>fs.collection(p),doc:p=>wrap(fs.doc(p))}}
async function fbBoot(cfgFb){
  await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`);
  await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`)]);
  firebase.initializeApp(cfgFb);FB={auth:firebase.auth(),fs:firebase.firestore(),cfg:cfgFb};
  try{await FB.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  FB.auth.onAuthStateChanged(async u=>{FB.unsubs?.forEach(f=>f());FB.unsubs=[];
    if(!u){S.mode='login';S.ready=true;const b=await FB.fs.doc('meta/bootstrap').get().catch(()=>null);S.bootstrapped=!!(b&&b.exists);render();return}
    const sd=await FB.fs.doc('staff/'+u.uid).get().catch(()=>null);
    if(!sd||!sd.exists){S.mode='login';S.ready=true;S.notStaff=u.email;render();return}
    const st=sd.data();S.me={id:u.uid,owner:st.role==='owner',manager:st.role==='owner'||st.role==='manager',email:u.email,name:st.name};S.notStaff=null;
    DB=fsAdapter(FB.fs);S.mode='db';S.fb=true;S.ready=false;render();startDb();
    const sub=(q,cb)=>FB.unsubs.push(q.onSnapshot(cb,e=>console.error(e)));
    sub(FB.fs.collection('staff'),s=>{S.staff=s.docs.map(d=>({...d.data(),id:d.id}));S.staff.forEach(x=>S.names[x.id]=x.name||x.email);schedule()});
    sub(FB.fs.collection('payreq').orderBy('createdAt','desc').limit(150),s=>{S.payreq=s.docs.map(d=>({...d.data(),id:d.id}));schedule()});
    sub(FB.fs.collection('requests').orderBy('createdAt','desc').limit(150),s=>{S.requests=s.docs.map(d=>({...d.data(),id:d.id}));schedule()});
  });
}

  if(!ok){const why=F.why.value.trim();if(!why){err.textContent='ใส่เหตุผลให้คนขับทราบ';return}

  let left=r2(+F.amt.value||0);if(left<=0){err.textContent='ใส่ยอดที่ได้รับ';return}

/* export / import all data as JSON */
const EXPORT_COLS=['cars','drivers','bills','swaps','maint','campaigns','offdays'];
function exportJSON(){const c={};EXPORT_COLS.forEach(k=>{c[k]={};S[k].forEach(d=>{const {id,...x}=d;c[k][id]=x})});if(S.config)c.config={main:S.config};
  saveFile(`vip-taxi-data-${today()}.json`,JSON.stringify({format:'vip-taxi-export-v1',exportedAt:new Date().toISOString(),collections:c},null,1))}
async function importJSON(file){if(!needMgr())return;let j;try{j=JSON.parse(await file.text())}catch(e){toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง','bad');return}
  const cols=j.collections||{};const n=Object.values(cols).reduce((s,o)=>s+Object.keys(o).length,0);if(!n){toast('ไม่พบข้อมูลในไฟล์','bad');return}
  if(!await confirmBox(`นำเข้าข้อมูล ${n} รายการ? รายการที่มีรหัสซ้ำกับของเดิมจะถูกเขียนทับ`,'นำเข้าข้อมูล'))return;
  const ok=await safe(async()=>{for(const [k,docs] of Object.entries(cols)){const ent=Object.entries(docs);
      if(k==='config'){if(docs.main)await putConfig(docs.main);continue}if(!EXPORT_COLS.includes(k))continue;
      for(let i=0;i<ent.length;i+=10)await Promise.all(ent.slice(i,i+10).map(([id,d])=>put(k,{...d,id})))}},`นำเข้าข้อมูล ${n} รายการแล้ว`);
  if(ok)log('นำเข้าข้อมูล',n+' รายการ')}

/* ---------- downloads ---------- */
async function saveFile(filename,data){
  if(!DL){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.json$/.test(filename)?'application/json':'text/html;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('ดาวน์โหลดไฟล์แล้ว')}catch(e){toast('ดาวน์โหลดไฟล์ไม่ได้ในหน้าที่เปิดอยู่นี้','bad')}return}
  try{const r=await DL.save({filename,data});if(r.status==='saved')toast('บันทึกไฟล์แล้ว')}catch(e){if(e?.code!=='declined')toast('ดาวน์โหลดไม่สำเร็จ','bad')}
}
function csv(rep){const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};return '﻿'+[rep.head,...rep.rows].map(r=>r.map(q).join(',')).join('\r\n')}
function billDoc(b){
  const css=`body{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#14171c;max-width:760px;margin:24px auto;padding:0 16px;font-size:14px}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #d6dae1;text-align:left}.r{text-align:right}.top{display:flex;justify-content:space-between;border-bottom:2px solid #14171c;padding-bottom:12px;gap:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:12px 0}.meta span{color:#5b6270;margin-right:8px}.words{background:#eef0f3;padding:6px 10px;margin-top:8px}.small{font-size:12.5px}.muted{color:#5b6270}.stamp{border:2px solid;padding:2px 10px;display:inline-block}.pill{font-size:12px}.sign{display:flex;justify-content:space-between;margin-top:56px;gap:24px}.sign div{flex:1;text-align:center;border-top:1px solid #14171c;padding-top:6px}`;
  return `<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${esc(b.no)}</title><style>${css}</style></head><body>${invoiceInner(b).replace(/class="inv"/,'')}${bBal(b)>0?ppBlock(bBal(b)):''}<div class="sign"><div>ผู้รับเงิน</div><div>ผู้ชำระเงิน (คนขับ)</div></div></body></html>`;
}
