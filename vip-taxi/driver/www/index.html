<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1747c9">
<title>VIP Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-hand phone app — gradient app bar, stacked white cards, fixed bottom tab bar */
:root{
  --bg:#eef3fb; --surface:#ffffff; --sunk:#f4f7fd; --tint:#e7eefc; --ink:#0f1b3d; --muted:#5a6788; --line:#dde6f4;
  --accent:#1d4ed8; --accent-2:#3b82f6; --accent-soft:#e3ecff; --on-accent:#ffffff;
  --hero-a:#1747c9; --hero-b:#0ea5e9;
  --ok:#0e9f6e; --ok-soft:#dcf7ec; --info:#7c3aed; --info-soft:#efe8ff; --bad:#e11d48; --bad-soft:#ffe4ea; --warn:#d97706; --warn-soft:#fff2d6; --sky:#0284c7; --sky-soft:#dff3fd;
  --shadow:0 1px 2px rgba(15,27,61,.05),0 10px 26px -14px rgba(29,78,216,.3);
  --overlay:rgba(8,20,52,.55);
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101f; --surface:#0f1a31; --sunk:#0c162b; --tint:#15244a; --ink:#e6edff; --muted:#93a3c8; --line:#203258;
  --accent:#4f8bff; --accent-2:#60a5fa; --accent-soft:#18295a; --on-accent:#ffffff; --hero-a:#1e40af; --hero-b:#0369a1;
  --ok:#34d399; --ok-soft:#0d3326; --info:#a78bfa; --info-soft:#271d4d; --bad:#fb7185; --bad-soft:#3e1426; --warn:#fbbf24; --warn-soft:#3a2b0a; --sky:#38bdf8; --sky-soft:#0b2c42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6); --overlay:rgba(2,6,18,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08101f; --surface:#0f1a31; --sunk:#0c162b; --tint:#15244a; --ink:#e6edff; --muted:#93a3c8; --line:#203258;
  --accent:#4f8bff; --accent-2:#60a5fa; --accent-soft:#18295a; --on-accent:#ffffff; --hero-a:#1e40af; --hero-b:#0369a1;
  --ok:#34d399; --ok-soft:#0d3326; --info:#a78bfa; --info-soft:#271d4d; --bad:#fb7185; --bad-soft:#3e1426; --warn:#fbbf24; --warn-soft:#3a2b0a; --sky:#38bdf8; --sky-soft:#0b2c42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6); --overlay:rgba(2,6,18,.7); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
/* app bar */
.bar{position:sticky;top:0;z-index:10;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;background:radial-gradient(circle at 95% -40%,rgba(255,255,255,.25) 0 110px,transparent 111px),linear-gradient(120deg,var(--hero-a),var(--hero-b))}
.bar h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25}
.bar p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:13px}
.bar .row{display:flex;align-items:center;gap:12px}
.bar .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.content{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;font-family:var(--f-display);font-weight:500;font-size:16px}
.card .hd small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12.5px}
.card .bd{padding:10px 16px 16px}
.hero{border-radius:22px;padding:18px;color:#fff;background:radial-gradient(circle at 110% 120%,rgba(255,255,255,.18) 0 120px,transparent 121px),linear-gradient(135deg,#1747c9,#3b82f6 55%,#0ea5e9);box-shadow:0 14px 30px -14px rgba(23,71,201,.7)}
.hero.ok{background:radial-gradient(circle at 110% 120%,rgba(255,255,255,.18) 0 120px,transparent 121px),linear-gradient(135deg,#047857,#10b981)}
.hero .l{font-size:13px;opacity:.9}
.hero .v{font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1.2;margin:2px 0 4px;overflow-wrap:anywhere}
.hero .s{font-size:13px;opacity:.9}
.hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .btn{background:#fff;color:#1747c9;border-color:#fff;font-weight:600}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1747c9;font-family:var(--f-display);font-weight:600;font-size:18px;flex:none}
.plate{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid #0f1b3d;border-radius:6px;padding:1px 8px;line-height:1.15;background:#fff;color:#0f1b3d;min-width:78px}
.plate b{font-family:var(--f-display);font-size:13.5px;font-weight:600}
.plate small{font-size:9.5px;color:#5a6788}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.qa svg{width:21px;height:21px}
.i-blue{background:var(--accent-soft);color:var(--accent)} .i-sky{background:var(--sky-soft);color:var(--sky)} .i-violet{background:var(--info-soft);color:var(--info)} .i-amber{background:var(--warn-soft);color:var(--warn)} .i-ok{background:var(--ok-soft);color:var(--ok)} .i-bad{background:var(--bad-soft);color:var(--bad)}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.li .ic svg{width:19px;height:19px}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{display:block;color:var(--muted);font-size:12.5px}
.li .r{text-align:right;flex:none}
.li .r .num{font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:999px;padding:1px 9px;white-space:nowrap;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-paid{background:var(--ok-soft);color:var(--ok)} .st-partial{background:var(--info-soft);color:var(--info)} .st-overdue{background:var(--bad-soft);color:var(--bad)} .st-open{background:var(--accent-soft);color:var(--accent)} .st-pending{background:var(--warn-soft);color:var(--warn)} .st-rejected{background:var(--bad-soft);color:var(--bad)} .st-approved{background:var(--ok-soft);color:var(--ok)}
/* buttons, inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);box-shadow:0 8px 18px -10px var(--accent)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea{min-height:80px;resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13.5px}
.note{background:var(--sky-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:500;box-shadow:var(--shadow)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
/* checks */
.chkrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.chkrow:first-child{border-top:0}
.chkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
/* qr */
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px}
.qrbox{width:220px;height:220px;max-width:100%;background:#ffffff;border-radius:14px;padding:8px;box-shadow:0 0 0 1px var(--line)}
.qrbox svg{width:100%;height:100%;display:block}
.pp-badge{background:#0b3d91;color:#fff;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:5px}
.amt{font-family:var(--f-num);font-size:28px;font-weight:600;color:var(--accent)}
.slip{display:flex;gap:12px;align-items:center}
.slip img{width:72px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.upload{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.upload input{display:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11.5px;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-family:var(--f-num);background:var(--sunk);color:var(--muted);max-width:100%}
.cal .d.paid{background:var(--ok);color:#fff} .cal .d.partial{background:var(--info);color:#fff} .cal .d.overdue{background:var(--bad);color:#fff} .cal .d.open{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)} .cal .d.off{background:var(--warn-soft);color:var(--warn)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
/* progress */
.prog{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hero-b))}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots span{width:22px;height:22px;border-radius:7px;background:var(--tint);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.dots span.on{background:var(--accent);color:#fff}
.dots span.free{background:var(--ok);color:#fff}
/* kv */
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.xchip{font-size:12px;border-radius:7px;padding:1px 8px;font-weight:500}
.x-ok{background:var(--ok-soft);color:var(--ok)} .x-warn{background:var(--warn-soft);color:var(--warn)} .x-bad{background:var(--bad-soft);color:var(--bad)}
/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -16px rgba(15,27,61,.35)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
.tabs svg{width:23px;height:23px}
.tabs button.on{color:var(--accent);font-weight:500}
.tabs .pay{margin-top:-22px}
.tabs .pay .fab{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--hero-b));box-shadow:0 10px 20px -8px var(--accent)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* sheet */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:19px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 12px 28px -10px rgba(0,0,0,.45)}
.toast.bad{background:var(--bad);color:#fff}
.demo{background:var(--warn-soft);color:var(--ink);font-size:12.5px;padding:7px 16px;text-align:center}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column}
.login .top{padding:calc(56px + env(safe-area-inset-top,0px)) 24px 64px;color:#fff;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.22) 0 120px,transparent 121px),linear-gradient(150deg,#0b2a6f,#1747c9 55%,#0ea5e9);border-radius:0 0 36px 36px}
.login .logo{display:inline-block;background:#fff;color:#1747c9;font-family:var(--f-display);font-weight:700;border-radius:14px;padding:8px 12px;letter-spacing:.06em;margin-bottom:18px}
.login h1{margin:0;font-family:var(--f-display);font-size:28px;font-weight:600}
.login .box{margin:-40px 18px 24px;background:var(--surface);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด…</div></div>
<div id="sheet"></div>
<script>window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;</script>
<script src="firebase-config.js" onerror="void 0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===== shared helpers (same rules as the office system) ===== */
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const TYPE={rent:'ค่าเช่ารายวัน',insurance:'ค่าประกัน',other:'ค่าอื่นๆ'};
const ST={paid:'ชำระแล้ว',partial:'ชำระบางส่วน',overdue:'เกินกำหนด',open:'รอชำระ',void:'ยกเลิก'};
const RQ={pending:'รอตรวจสอบ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ'};
const DEF_LATE={on:true,types:['rent','insurance','other'],mode:'perDay',amount:50,grace:0,cap:500};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${+d} ${TH_MS[m-1]} ${+y+543}`};
const ml=m=>{const [y,mm]=m.split('-');return `${TH_M[mm-1]} ${+y+543}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function bahtText(num){const N=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const seg=str=>{str=str.replace(/^0+/,'');if(!str)return '';let o='';const L=str.length,val=+str;for(let i=0;i<L;i++){const d=+str[i],p=L-1-i;if(!d)continue;if(p===1&&d===1)o+='สิบ';else if(p===1&&d===2)o+='ยี่สิบ';else if(p===0&&d===1&&val>1)o+='เอ็ด';else o+=N[d]+P[p]}return o};
  const read=str=>{str=str.replace(/^0+/,'');if(!str)return '';if(str.length>6)return read(str.slice(0,-6))+'ล้าน'+seg(str.slice(-6));return seg(str)};
  num=r2(Math.abs(num));const [b,s]=num.toFixed(2).split('.');const bt=read(b),st=read(s);if(!bt&&!st)return 'ศูนย์บาทถ้วน';return (bt?bt+'บาท':'')+(st?st+'สตางค์':'ถ้วน')}
const lateCfg=()=>({...DEF_LATE,...((A.cfg||{}).late||{})});
function ruleFor(type){const L=lateCfg();return L.on&&L.types.includes(type)&&+L.amount>0?{mode:L.mode,amount:+L.amount,grace:+L.grace||0,cap:+L.cap||0}:null}
const bTotal=b=>Math.max(0,r2((b.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)-(+b.discount||0)));
const bPaid=b=>r2((b.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));
function lateInfo(b){const z={fee:0,days:0};if(b.void||!b.dueDate||b.waiveLate)return z;const R=b.lateRule===null?null:(b.lateRule||ruleFor(b.type));if(!R||!(+R.amount>0))return z;
  const P=bTotal(b);if(P<=0)return z;let stop=today(),cum=0;for(const p of (b.payments||[]).slice().sort((a,c)=>(a.date||'').localeCompare(c.date||''))){cum+=+p.amount||0;if(cum>=P-0.004){stop=p.date;break}}
  const late=diffDays(b.dueDate,stop),days=late-(+R.grace||0);if(days<=0)return {fee:0,days:Math.max(0,late)};
  let fee=R.mode==='flat'?+R.amount:R.mode==='percent'?P*(+R.amount)/100*days:days*(+R.amount);if(+R.cap>0)fee=Math.min(fee,+R.cap);return {fee:r2(fee),days:late}}

  const p=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('58','TH')+tlv('53','764')+(amt?tlv('54',(+amt).toFixed(2)):'')+'6304';return p+crc16(p)}

/* ===== sheets ===== */
function sheet(html){document.getElementById('sheet').innerHTML=`<div class="ov" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`}
const closeSheet=()=>document.getElementById('sheet').innerHTML='';
function billSheet(id){const b=A.bills.find(x=>x.id===id);if(!b)return;const L=lateInfo(b),bal=bBal(b);
  sheet(`<h3>${TYPE[b.type]}</h3><div class="small muted" style="margin-bottom:10px">${esc(b.no)} · ออก ${fd(b.issueDate)} · ครบ ${fd(b.dueDate)} ${pill(bSt(b))}</div>

   ${L.fee?`<div class="kv"><span>ค่าปรับชำระล่าช้า ${L.days} วัน</span><span class="num" style="color:var(--bad)">${money(L.fee)}</span></div>`:''}

   ${(b.payments||[]).map(p=>`<div class="kv"><span>ชำระ ${fd(p.date)} · ${esc(p.method||'')}${p.receiptNo?' · '+esc(p.receiptNo):''}</span><span class="num">−${money(p.amount)}</span></div>`).join('')}

   <div class="small muted" style="margin:8px 0 14px">(${bahtText(bDue(b))})</div>

   ${pendingBillIds().has(b.id)?'<div class="note warn">บิลนี้มีสลิปรอเจ้าหน้าที่ตรวจ</div>':''}`)}
function receiptsSheet(){const m={};A.bills.forEach(b=>(b.payments||[]).forEach(p=>{if(!p.receiptNo)return;const r=m[p.receiptNo]=m[p.receiptNo]||{no:p.receiptNo,date:p.date,method:p.method,total:0,bills:[]};r.total=r2(r.total+(+p.amount||0));r.bills.push(b.no)}));

   ${kind==='breakdown'?`<label class="upload" id="rqPhLbl">${ic('cam')}<div><b>แนบรูป (ไม่บังคับ)</b></div><input type="file" accept="image/*" id="rqPh"></label>`:''}

function pinForm(){sheet(`<h3>เปลี่ยนรหัส PIN</h3><div class="form"><label class="fld"><span>PIN ปัจจุบัน</span><input type="password" inputmode="numeric" maxlength="6" id="pOld"></label><label class="fld"><span>PIN ใหม่ 6 หลัก</span><input type="password" inputmode="numeric" maxlength="6" id="pNew"></label><label class="fld"><span>ยืนยัน PIN ใหม่</span><input type="password" inputmode="numeric" maxlength="6" id="pNew2"></label><div class="err" id="pErr"></div><button class="btn pri block" data-act="savePin">บันทึก PIN ใหม่</button></div>`)}
function confirmSheet(msg,ok){return new Promise(res=>{sheet(`<h3>ยืนยัน</h3><div style="margin-bottom:16px">${msg}</div><div class="two"><button class="btn" id="cfN">ยกเลิก</button><button class="btn pri" id="cfY">${ok}</button></div>`);document.getElementById('cfN').onclick=()=>{closeSheet();res(false)};document.getElementById('cfY').onclick=()=>{closeSheet();res(true)}})}
function toast(m,k=''){const t=document.createElement('div');t.className='toast '+k;t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

/* ===== login ===== */
function loginView(){return `<div class="login"><div class="top"><span class="logo">VIP</span><h1>VIP Driver</h1><div style="opacity:.85;margin-top:4px">แอปสำหรับผู้เช่าขับ ดูบิล จ่ายค่าเช่า และแจ้งเรื่องถึงบริษัท</div></div>
  <div class="box form"><label class="fld"><span>เบอร์มือถือ</span><input type="tel" id="lgPhone" inputmode="numeric" autocomplete="tel" placeholder="08x-xxx-xxxx"></label>
  <label class="fld"><span>รหัส PIN 6 หลัก</span><input type="password" id="lgPin" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"></label>
  <div class="err" id="lgErr"></div><button class="btn pri block" id="lgGo">เข้าสู่ระบบ</button>
  <div class="small muted" style="text-align:center">ยังไม่มีรหัส PIN หรือลืมรหัส ติดต่อเจ้าหน้าที่บริษัท</div></div></div>`}
function bindLogin(){const go=document.getElementById('lgGo');const run=async()=>{const err=document.getElementById('lgErr');err.textContent='';
  const ph=document.getElementById('lgPhone').value.replace(/\D/g,''),pin=document.getElementById('lgPin').value.trim();
  if(ph.length<9){err.textContent='ใส่เบอร์มือถือให้ครบ';return}if(!/^\d{6}$/.test(pin)){err.textContent='PIN ต้องเป็นตัวเลข 6 หลัก';return}
  if(!fb){Object.assign(A,demoData());A.mode='demo';A.tab='home';render();return}
  go.disabled=true;go.textContent='กำลังเข้าสู่ระบบ…';try{await fbLogin(ph,pin)}catch(e){err.textContent=e.message||'เข้าสู่ระบบไม่สำเร็จ';go.disabled=false;go.textContent='เข้าสู่ระบบ'}};
  go.onclick=run;document.getElementById('lgPin').onkeydown=e=>{if(e.key==='Enter')run()}}

/* ===== Firebase ===== */
const FBV='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const normPhone=p=>{p=String(p).replace(/\D/g,'');if(p.startsWith('66'))p='0'+p.slice(2);return p};
async function fbLogin(phone,pin){const key=await sha256('vip:'+normPhone(phone));const s=await fb.fs.doc('loginKey/'+key).get();
  if(!s.exists)throw new Error('ไม่พบเบอร์นี้ในระบบ ติดต่อเจ้าหน้าที่เพื่อเปิดบัญชี');
  try{await fb.auth.signInWithEmailAndPassword(s.data().email,pin)}catch(e){throw new Error(e.code==='auth/too-many-requests'?'ลองผิดหลายครั้ง กรุณารอสักครู่':'PIN ไม่ถูกต้อง')}}
async function fbStart(cfg){
  await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`);
  await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`)]);
  firebase.initializeApp(cfg);fb={auth:firebase.auth(),fs:firebase.firestore()};
  fb.auth.onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];A.user=u;
    if(!u){A.mode='login';render();return}
    try{const m=await fb.fs.doc('driverAuth/'+u.uid).get();if(!m.exists){toast('บัญชีนี้ยังไม่ผูกกับข้อมูลคนขับ','bad');await fb.auth.signOut();return}
      const did=m.data().driverId;A.driverId=did;A.mode='fb';let carUnsub=null;
      const err=e=>{console.error(e);toast('โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ต','bad')};
      unsubs.push(fb.fs.doc('drivers/'+did).onSnapshot(s=>{A.driver={...s.data(),id:did};if(A.driver.carId!==A.car?.id){carUnsub&&carUnsub();A.car=null;if(A.driver.carId){carUnsub=fb.fs.doc('cars/'+A.driver.carId).onSnapshot(c=>{A.car=c.exists?{...c.data(),id:c.id}:null;soft()},err);unsubs.push(()=>carUnsub&&carUnsub())}}soft()},err));
      unsubs.push(fb.fs.collection('bills').where('driverId','==',did).onSnapshot(s=>{A.bills=s.docs.map(d=>({...d.data(),id:d.id}));soft()},err));
      unsubs.push(fb.fs.doc('config/main').onSnapshot(s=>{A.cfg=s.exists?s.data():{};soft()},err));
      unsubs.push(fb.fs.collection('campaigns').onSnapshot(s=>{A.campaigns=s.docs.map(d=>({...d.data(),id:d.id}));soft()},()=>{}));
      unsubs.push(fb.fs.collection('payreq').where('driverId','==',did).onSnapshot(s=>{A.payreqs=s.docs.map(d=>({...d.data(),id:d.id,slip:undefined}));soft()},err));
      unsubs.push(fb.fs.collection('requests').where('driverId','==',did).onSnapshot(s=>{A.requests=s.docs.map(d=>({...d.data(),id:d.id,photo:undefined}));soft()},err));
      render();
    }catch(e){console.error(e);toast('เข้าสู่ระบบไม่สำเร็จ','bad');await fb.auth.signOut()}});
}
let softQ=false;function soft(){if(softQ)return;softQ=true;requestAnimationFrame(()=>{softQ=false;if(document.querySelector('#sheet .ov'))return;A.keepScroll=true;render()})}
async function addDoc(col,data){if(A.mode==='fb')return fb.fs.collection(col).add(data);const d={...data,id:uid()};(col==='payreq'?A.payreqs:A.requests).push(d);return d}

/* ===== events ===== */
document.addEventListener('click',async e=>{const tb=e.target.closest('[data-tab]');if(tb){A.tab=tb.dataset.tab;closeSheet();render();window.scrollTo(0,0);return}
  const sg=e.target.closest('[data-seg]');if(sg){A.billSeg=sg.dataset.seg;render();return}
  const cl=e.target.closest('[data-cal]');if(cl){const [y,m]=A.calMonth.split('-').map(Number);const n=new Date(y,m-1+(+cl.dataset.cal),1);A.calMonth=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==='closeSheet'){if(e.target===a)closeSheet();return}
  if(act==='bill')return billSheet(id);
  if(act==='receipts')return receiptsSheet();
  if(act==='newLeave')return reqForm('leave');
  if(act==='newBreak')return reqForm('breakdown');
  if(act==='pin')return pinForm();
  if(act==='payOne'){A.paySel=new Set([id]);A.tab='pay';closeSheet();render();window.scrollTo(0,0);return}
  if(act==='payreq'){const p=A.payreqs.find(x=>x.id===id);sheet(`<h3>สลิป ฿${money(p.amount)}</h3><div class="kv"><span>ส่งเมื่อ</span><span>${fd((p.createdAt||'').slice(0,10))}</span></div><div class="kv"><span>สถานะ</span>${pill(p.status,RQ)}</div>${p.receiptNo?`<div class="kv"><span>ใบเสร็จ</span><b class="num">${esc(p.receiptNo)}</b></div>`:''}${p.rejectReason?`<div class="note bad" style="margin-top:8px">${esc(p.rejectReason)}</div>`:''}<div class="kv"><span>บิล</span><span class="small">${(p.billIds||[]).map(b=>esc(A.bills.find(x=>x.id===b)?.no||b)).join(', ')}</span></div>`);return}
  if(act==='reqView'){const r=A.requests.find(x=>x.id===id);sheet(`<h3>${r.kind==='leave'?'ลาหยุด':'แจ้งรถเสีย'}</h3><div class="kv"><span>วันที่</span><span>${fd(r.from)}${r.to&&r.to!==r.from?' – '+fd(r.to):''}</span></div><div class="kv"><span>สถานะ</span>${pill(r.status,RQ)}</div><div class="kv"><span>รายละเอียด</span><span>${esc(r.reason||'')}</span></div>${r.reply?`<div class="note" style="margin-top:8px">ตอบกลับ: ${esc(r.reply)}</div>`:''}`);return}
  if(act==='logout'){if(!await confirmSheet('ออกจากระบบ?','ออกจากระบบ'))return;if(A.mode==='fb')await fb.auth.signOut();else{A.mode='login';render()}return}
  if(act==='sendSlip'){const err=document.getElementById('payErr');err.textContent='';const ids=[...A.paySel];const amt=r2(openBills().filter(b=>A.paySel.has(b.id)).reduce((s,b)=>s+bBal(b),0));
    if(!ids.length){err.textContent='เลือกบิลก่อน';return}if(!A.slip){err.textContent='แนบรูปสลิปก่อนส่ง';return}
    a.disabled=true;a.textContent='กำลังส่ง…';
    try{await addDoc('payreq',{driverId:A.driverId||A.driver.id,billIds:ids,amount:amt,slip:A.slip,note:(document.getElementById('payNote')?.value||'').trim(),status:'pending',createdAt:new Date().toISOString(),authUid:A.user?.uid||null});
      A.slip=null;A.paySel=null;toast('ส่งสลิปแล้ว รอเจ้าหน้าที่ตรวจ');render()}catch(x){console.error(x);err.textContent='ส่งไม่สำเร็จ ลองอีกครั้ง';a.disabled=false;a.textContent='ส่งสลิป'}return}
  if(act==='sendReq'){const k=a.dataset.k,f=document.getElementById('rqF').value,t=document.getElementById('rqT').value,r=document.getElementById('rqR').value.trim(),err=document.getElementById('rqErr');
    if(!f||!t||t<f){err.textContent='ตรวจวันที่ให้ถูกต้อง';return}if(!r){err.textContent='ใส่รายละเอียดก่อนส่ง';return}a.disabled=true;
    try{await addDoc('requests',{driverId:A.driverId||A.driver.id,carId:A.driver?.carId||null,kind:k,from:f,to:t,reason:r,photo:A.rqPhoto||null,status:'pending',createdAt:new Date().toISOString(),authUid:A.user?.uid||null});A.rqPhoto=null;closeSheet();toast('ส่งคำขอแล้ว');A.tab='req';render()}catch(x){console.error(x);err.textContent='ส่งไม่สำเร็จ ลองอีกครั้ง';a.disabled=false}return}
  if(act==='savePin'){const o=document.getElementById('pOld').value,n=document.getElementById('pNew').value,n2=document.getElementById('pNew2').value,err=document.getElementById('pErr');
    if(!/^\d{6}$/.test(n)){err.textContent='PIN ใหม่ต้องเป็นตัวเลข 6 หลัก';return}if(n!==n2){err.textContent='PIN ใหม่ทั้งสองช่องไม่ตรงกัน';return}
    try{const u=fb.auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));await u.updatePassword(n);closeSheet();toast('เปลี่ยน PIN แล้ว')}catch(x){err.textContent=x.code==='auth/wrong-password'||x.code==='auth/invalid-credential'?'PIN ปัจจุบันไม่ถูกต้อง':'เปลี่ยน PIN ไม่สำเร็จ'}return}
});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.pick){if(el.checked)A.paySel.add(el.dataset.pick);else A.paySel.delete(el.dataset.pick);A.keepScroll=true;render();return}
  if(el.id==='slipIn'&&el.files[0]){try{A.slip=await compressImage(el.files[0]);A.keepScroll=true;render()}catch(x){toast('อ่านรูปไม่ได้ ลองเลือกรูปอื่น','bad')}}});

/* ===== start ===== */
(async()=>{if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){try{await fbStart(window.FIREBASE_CONFIG)}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="loading">เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดแอปใหม่</div>'}}
  else{Object.assign(A,demoData());A.mode='demo';render()}})();
</script>
</body>
</html>
