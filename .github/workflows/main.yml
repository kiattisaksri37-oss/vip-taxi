name: Build VIP apps

# สร้างไฟล์ APK ของแอปคนขับ (โค้ดอยู่ในโฟลเดอร์ vip-taxi)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy Firebase settings into the app
        run: cp vip-taxi/firebase-config.js vip-taxi/driver/www/firebase-config.js

      - name: Install Capacitor
        working-directory: vip-taxi/driver
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: vip-taxi/driver
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android || echo "icon generation skipped"
          npx cap sync android

      - name: Set version number
        working-directory: vip-taxi/driver/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle

      - name: Build APK
        working-directory: vip-taxi/driver/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp vip-taxi/driver/android/app/build/outputs/apk/debug/app-debug.apk "VIP-Driver-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VIP-Driver-APK
          path: VIP-Driver-*.apk
          retention-days: 30
